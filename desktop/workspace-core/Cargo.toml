[package]
name = "llmide-workspace-core"
version = "0.0.0"
description = "Tauri-free file, path and trash logic shared by the desktop host and the SSH workspace helper"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "llmide_workspace_core"
path = "src/lib.rs"

[features]
# Exposes `trash::tests::FakeTrash` to dependents' tests (the desktop enables it as a dev-dependency feature).
test-util = []

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
ignore = "=0.4.25"
trash = "=5.2.9"
libc = "=0.2.191"
base64 = "=0.22.1"
notify = "=8.2.1"
regex = "=1.13.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "=1.0.145"
