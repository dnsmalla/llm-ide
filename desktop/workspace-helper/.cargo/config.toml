# Static Linux build from a Mac: the musl target links with the toolchain's own rust-lld and
# no system C library, so the binary runs on any x86_64 Linux server whatever its glibc.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=yes", "-C", "target-feature=+crt-static"]
