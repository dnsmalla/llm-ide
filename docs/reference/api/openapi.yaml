      summary: "Attach the meeting agent question-loop to an active live session"
      tags:
        - "agent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                sessionId:
                  type: "string"
                planId:
                  type:
                    - "string"
                    - "null"
                persona:
                  type:
                    - "string"
                    - "null"
                language:
                  type:
                    - "string"
                    - "null"
                meetingUrl:
                  type:
                    - "string"
                    - "null"
      responses:
        "200":
          description: "Dispatch result"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "sessionId"
                  - "planId"
                  - "attached"
                properties:
                  sessionId:
                    type: "string"
                  planId:
                    type:
                      - "string"
                      - "null"
                  attached:
                    type: "boolean"
