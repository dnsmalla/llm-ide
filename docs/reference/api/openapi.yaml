  /kb/outcomes/refresh:
    post:
      summary: "Poll dispatched tasks across providers and record outcomes"
      tags:
        - "planning"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                taskIds:
                  type: "array"
                  items:
                    type: "string"
                creds:
                  type: "object"
                  description: "Inline credentials, merged over the vault values; not echoed back."
                  additionalProperties: true
      responses:
        "200":
          description: "Poll summary"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "pollErroredCount"
                  - "pollCount"
                  - "changedCount"
                  - "durationMs"
                  - "byState"
                  - "polled"
                properties:
                  pollErroredCount:
                    type: "integer"
                  pollCount:
                    type: "integer"
                  changedCount:
                    type: "integer"
                  durationMs:
                    type: "integer"
                  byState:
                    type: "object"
                    additionalProperties:
                      type: "integer"
                  polled:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "taskId"
                        - "state"
                        - "changed"
                      properties:
                        taskId:
                          type: "string"
                        planId:
                          type: "string"
                        title:
                          type: "string"
                        provider:
                          type: "string"
                        url:
                          type: "string"
                        state:
                          type: "string"
                        meta:
                          type: "object"
                          additionalProperties: true
                          description: "Poll detail (error, or the provider's status)."
                        changed:
                          type: "boolean"
                        circuitOpen:
                          type: "boolean"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Refresh failed"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
