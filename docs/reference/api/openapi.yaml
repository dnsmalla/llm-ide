  /kb/custom-providers:
    post:
      summary: "Sync the Mac app's custom model providers to the server"
      description: "Replaces the CALLER's custom-provider list (other users are untouched). The list is persisted per user, so it survives a server restart; an empty array deletes it. Entries without an id, a name, or an http(s) baseURL are dropped."
      tags:
        - "providers-usage"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                providers:
                  type: "array"
                  items:
                    type: "object"
                    description: "A custom provider as the Mac app sends it (Core/Platform/CustomProvider.swift). The server keeps id, name, baseURL, models, isOpenAICompatible, isEnabled and anthropicBaseURL; apiKey is the vault key path (for example custom.<id>.apiKey), never the key itself. Invalid entries (no http(s) baseURL, no name) are dropped; at most 50 are stored."
                    properties:
                      id:
                        type: "string"
                      name:
                        type: "string"
                      baseURL:
                        type: "string"
                      apiKey:
                        type: "string"
                        description: "vault key path"
                      models:
                        type: "array"
                        items:
                          type: "object"
                          additionalProperties: true
                          required:
                            - "id"
                          properties:
                            id:
                              type: "string"
                            displayName:
                              type: "string"
                      isOpenAICompatible:
                        type: "boolean"
                      isEnabled:
                        type: "boolean"
                      anthropicBaseURL:
                        type:
                          - "string"
                          - "null"
                        description: "Anthropic-format endpoint for the Agent engine; null when absent"
      responses:
        "200":
          description: "Synced"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "success"
                  - "count"
                properties:
                  success:
                    type: "boolean"
                  count:
                    type: "integer"
        "400":
          description: "Invalid request body"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "405":
          description: "Method not allowed"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "Request body too large"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
