  /kb/email/fetch:
    post:
      summary: "Fetch recent emails via IMAP and return them for ingestion"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                host:
                  type: "string"
                port:
                  type: "integer"
                secure:
                  type: "boolean"
                user:
                  type: "string"
                mailbox:
                  type: "string"
                authMethod:
                  type: "string"
                  description: "password | google"
                lookbackDays:
                  type: "number"
                  description: "How many days back to look"
                unreadOnly:
                  type: "boolean"
                  description: "default true"
                fromFilter:
                  type: "string"
                  description: "Filter by sender address substring"
                markRead:
                  type: "boolean"
      responses:
        "200":
          description: "Fetched messages (server-side high-water mark and dedup applied)"
        "400":
          description: "Missing host/user or no IMAP password stored"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "IMAP error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/email/seen:
    post:
      summary: "Record imported message IDs and advance the IMAP high-water mark"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                messageIds:
                  type: "array"
                  items:
                    type: "string"
                  description: "IMAP message IDs to mark as seen"
                lastFetchedAt:
                  type: "string"
                  description: "advances the forward-only high-water mark when it parses as a date"
      responses:
        "200":
          description: "ok"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/KbSourcesOk"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/email/test:
    post:
      summary: "Test IMAP connection using stored app password"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                host:
                  type: "string"
                port:
                  type: "integer"
                secure:
                  type: "boolean"
                user:
                  type: "string"
                password:
                  type: "string"
                  description: "typed app password, probed without saving it"
                mailbox:
                  type: "string"
                authMethod:
                  type: "string"
                  description: "password | google"
      responses:
        "200":
          description: "Connection success with mailbox info"
        "400":
          description: "Missing credentials or no password stored"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "IMAP connection failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/entity/{id}:
    get:
      summary: "Fetch a single KB entity (action / decision / blocker / etc.) by ID"
      tags:
        - "kb-sources"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_-]{1,128}$"
      responses:
        "200":
          description: "Entity record"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Entity"
        "400":
          description: "Invalid ID format"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/export-all:
    get:
      summary: "Export every KB row for the caller as newline-delimited JSON, paged by cursor"
      tags:
        - "kb-sources"
      parameters:
        - name: "cursor"
          in: "query"
          required: false
          description: "meeting id to resume after"
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          description: "Capped at 500; an absent value gives 100, and 0 or a non-numeric value is not replaced by the default."
          schema:
            type: "integer"
            default: 100
      responses:
        "200":
          description: "NDJSON stream of export records"
          content:
            application/x-ndjson:
              schema:
                type: "string"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
