        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                provider:
                  type: "string"
      responses:
        "200":
          description: "Model ID list (empty when nothing could be listed). For `anthropic` the list comes from the Agent SDK — the account's own models, with or without an API key — in the SDK's order (its default first), with display names in `entries`; if the SDK cannot answer it falls back to the key-based `/v1/models` listing. Other providers: sorted ids from their models endpoint."
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "models"
                properties:
                  models:
                    type: "array"
                    items:
                      type: "string"
                  detail:
                    type: "string"
                    description: "Human-readable reason when models is empty"
                  entries:
                    type: "array"
                    items:
                      type: "object"
                      required:
