            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/ingest-code-graph:
    post:
      summary: "Store a repo's structural code graph (nodes/edges) for agent traversal"
      description: "Written by the macOS app after each knowledge-graph generation. Populates `code_graph_nodes`/`code_graph_edges` with `source='structure'`, which backs `findRelatedSymbols` and the code-sync agent's symbol grounding. Large graphs arrive in batches — set `replace` on the first batch only, otherwise each batch discards the previous one. One request accepts at most 5000 nodes and 20000 edges."
      tags:
        - "live-loop-misc"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                repoPath:
                  type: "string"
                  description: "Absolute path to the repo root (must be on user allow-list)"
                graph:
                  type: "object"
                  properties:
                    nodes:
                      type: "array"
                      items:
                        "$ref": "#/components/schemas/CodeGraphNode"
                    edges:
                      type: "array"
                      items:
                        "$ref": "#/components/schemas/CodeGraphEdge"
                replace:
                  type: "boolean"
                  description: "Clear this producer's existing rows for the repo first (first batch only)"
                commitSha:
                  type: "string"
                  description: "Git commit the graph was generated from (7-64 hex); find-code compares it to HEAD to warn about a stale graph"
                generatedAt:
                  type: "string"
                  description: "ISO-8601 time the graph was generated"
      responses:
        "200":
          description: "Stored counts for this batch, plus entries dropped as malformed"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "repo"
                  - "nodes"
                  - "edges"
                  - "droppedNodes"
                  - "droppedEdges"
                  - "replaced"
                properties:
                  ok:
                    const: true
                  repo:
                    type: "string"
                    description: "canonical repo path"
                  nodes:
                    type: "integer"
                    description: "nodes written"
                  edges:
                    type: "integer"
                    description: "edges written"
                  droppedNodes:
                    type: "integer"
                  droppedEdges:
                    type: "integer"
                  replaced:
                    type: "boolean"
        "400":
          description: "Missing fields or batch over the per-request cap"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Path not on user allow-list"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "feature_disabled — LLMIDE_FEATURES omits code_graph_3d; the route module is not loaded"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FeatureDisabled"
  /kb/ingest-scip:
    post:
      summary: "Ingest a SCIP index into the code-graph tables"
      description: "`repoPath` must be on the caller's repo allow-list (compared after `path.resolve`), since it is used as the graph's identity key."
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
