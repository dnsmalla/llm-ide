                  subagents:
                    type: "object"
                    required:
                      - "plugins"
                    properties:
                      plugins:
                        type: "array"
                        items:
                          type: "object"
                          additionalProperties: true
                          description: "one entry per enabled plugin that declares subagents; the entry is the plugin's own manifest data (pluginName, pluginDisplayName, subagents) and no capture plugin declares one, so it is not pinned"
  /kb/agent/commands:
    get:
