                          type: "boolean"
                          description: "true when the Agent SDK can load the plugin from its .claude-plugin manifest"
                        nativePluginsOn:
                          type: "boolean"
                          description: "this user's nativePlugins preference"
                        skillCount:
                          type: "integer"
                        commands:
                          type: "array"
                          description: "{trigger, description} rows"
                        subagents:
                          type: "array"
                          description: "{name, description, allowedTools} rows"
                        format:
                          type: "string"
                          description: "llmide | claude | codex"
                        origin:
                          type:
                            - "string"
                            - "null"
                          description: "'claude' | 'codex' when a vendor bridge imported it, else null"
                        sourceVersion:
                          type:
                            - "string"
                            - "null"
                        installSource:
                          type:
                            - "string"
                            - "null"
                          description: "where git/marketplace/zip installs came from"
                        unsupportedComponents:
                          type: "array"
                        pendingComponents:
                          type: "array"
                        hookCount:
                          type: "integer"
                          description: "runnable hook handlers the plugin declares"
                        declaresHooks:
                          type: "boolean"
                        executableKinds:
                          type: "array"
                          description: "hook kinds llm-ide will run"
