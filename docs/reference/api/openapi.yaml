                          - "label"
                          - "priority"
                          - "enabled"
                          - "limit_value"
                          - "unit"
                          - "window_kind"
                          - "threshold_pct"
                          - "custom"
                        properties:
                          provider:
                            type: "string"
                          model:
                            type: "string"
                          label:
                            type: "string"
                          priority:
                            type: "integer"
                          enabled:
                            type: "boolean"
                          limit_value:
                            type: "integer"
                          unit:
                            type: "string"
                            enum:
                              - "runs"
                              - "tokens"
                          window_kind:
                            type: "string"
                            enum:
                              - "daily"
                              - "monthly"
                          threshold_pct:
                            type: "integer"
                          custom:
                            type: "boolean"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    put:
      summary: "Replace the per-model caps for the providers present in the body"
      tags:
        - "providers-usage"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "chains is required (400 otherwise). Only the providers present are replaced. Each entry reads model, priority, enabled, limit_value, unit, window_kind and threshold_pct; the server ignores the read-only label and custom the Mac also sends."
              properties:
                chains:
                  type: "object"
                  additionalProperties:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        model:
                          type: "string"
                        priority:
                          type: "integer"
                        enabled:
                          type: "boolean"
                        limit_value:
                          type: "integer"
                        unit:
                          type: "string"
                        window_kind:
                          type: "string"
                        threshold_pct:
                          type: "integer"
                  description: "{ provider: [ { model, priority, enabled, limit_value, unit, window_kind, threshold_pct } ] }"
      responses:
        "200":
          description: "Saved; returns the merged chains"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "chains"
                properties:
                  ok:
                    type: "boolean"
                  chains:
                    type: "object"
                    description: "Per provider, the chain of models with their caps. GET lists the built-in chain merged with the user's overrides, sorted by priority."
                    additionalProperties:
                      type: "array"
                      items:
                        type: "object"
                        required:
                          - "provider"
                          - "model"
                          - "label"
                          - "priority"
                          - "enabled"
                          - "limit_value"
                          - "unit"
                          - "window_kind"
                          - "threshold_pct"
                          - "custom"
                        properties:
                          provider:
                            type: "string"
                          model:
                            type: "string"
                          label:
                            type: "string"
                          priority:
                            type: "integer"
                          enabled:
                            type: "boolean"
                          limit_value:
                            type: "integer"
                          unit:
                            type: "string"
                            enum:
                              - "runs"
                              - "tokens"
                          window_kind:
                            type: "string"
                            enum:
                              - "daily"
                              - "monthly"
                          threshold_pct:
                            type: "integer"
                          custom:
                            type: "boolean"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/usage/ratelimits:
    get:
      summary: "Latest provider API rate-limit snapshot (API-key mode only; null otherwise)"
      tags:
        - "providers-usage"
      parameters:
        - name: "provider"
          in: "query"
          required: false
          description: "default anthropic"
          schema:
            type: "string"
      responses:
        "200":
          description: "Rate-limit buckets (requests/tokens limit, remaining, reset) or null"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ratelimits"
                properties:
                  ratelimits:
                    type:
                      - "object"
                      - "null"
                    description: "The latest Anthropic/OpenAI-compatible rate-limit snapshot from a live response's headers (in-memory, per server run). null when only the CLI path ran, which is always the case offline. The object shape (capturedAt, provider, model, requests, tokens, inputTokens, outputTokens; each bucket limit/remaining/reset) is described but not covered: no live response is captured."
                    properties:
                      capturedAt:
                        type: "string"
                      provider:
                        type: "string"
                      model:
                        type:
                          - "string"
                          - "null"
                      requests:
                        type:
                          - "object"
                          - "null"
                      tokens:
                        type:
                          - "object"
                          - "null"
                      inputTokens:
                        type:
                          - "object"
                          - "null"
                      outputTokens:
                        type:
                          - "object"
                          - "null"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/usage/record:
    post:
      summary: "Record one usage event (used by the Mac Auto Tasks CLI path)"
      tags:
        - "providers-usage"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "Read by POST /kb/usage/record. provider and model are required (400 otherwise). Token and turn counts are optional non-negative integers; absent or null means not reported. source is api | cli | auto-task (any other value is stored as api)."
              properties:
                provider:
                  type: "string"
                model:
                  type: "string"
                source:
                  type: "string"
                  description: "api|cli|auto-task"
                endpoint:
                  type: "string"
                runs:
                  type: "integer"
                inputTokens:
                  type: "integer"
                outputTokens:
                  type: "integer"
                cacheReadTokens:
                  type: "integer"
                cacheCreationTokens:
                  type: "integer"
                turns:
                  type: "integer"
                stopReason:
                  type: "string"
                requestId:
                  type: "string"
      responses:
        "200":
          description: "Recorded"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "id"
                properties:
                  ok:
                    type: "boolean"
                  id:
                    type:
                      - "integer"
                      - "null"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/usage/resolve:
    get:
      summary: "Which model in a provider's chain should run next (auto-fallback)"
      tags:
        - "providers-usage"
      parameters:
        - name: "provider"
          in: "query"
          required: false
          description: "anthropic | openai | google | custom; default anthropic"
          schema:
            type: "string"
            enum:
              - "anthropic"
              - "openai"
              - "google"
              - "custom"
            default: "anthropic"
        - name: "prefer"
          in: "query"
          required: false
          description: "Preferred model — kept when healthy, stepped down only when constrained"
          schema:
            type: "string"
      responses:
        "200":
          description: "Resolution (model, status ok|degraded|paused|unconfigured, resetAt, reason, engaged)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Resolution"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/usage/summary:
    get:
      summary: "Live per-model usage + resolved active model per provider (dashboard)"
      tags:
        - "providers-usage"
      parameters:
        - name: "provider"
          in: "query"
          required: false
          description: "restricts providers to one"
          schema:
            type: "string"
      responses:
        "200":
          description: "Per-provider usage summary"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "providers"
                properties:
                  providers:
                    type: "object"
                    additionalProperties:
                      type: "object"
                      required:
                        - "active"
                        - "models"
                      properties:
                        active:
                          type: "object"
                          required:
                            - "provider"
                            - "model"
                            - "status"
                            - "resetAt"
                            - "reason"
                            - "engaged"
                          description: "The resolver verdict (kb/usage.mjs resolveModel). used, limit, pct and unit are present only when a model was picked (ok or degraded); a paused or unconfigured verdict has no pick."
                          properties:
                            provider:
                              type: "string"
                            model:
                              type:
                                - "string"
                                - "null"
                              description: "null when paused or unconfigured"
                            status:
                              type: "string"
                              enum:
                                - "ok"
                                - "degraded"
                                - "paused"
                                - "unconfigured"
                            resetAt:
                              type:
                                - "string"
                                - "null"
                              description: "ISO-8601 window reset; null when there is no chain"
                            reason:
                              type: "string"
                            used:
                              type: "number"
                            limit:
                              type: "number"
                            pct:
                              type: "number"
                            unit:
                              type: "string"
                            engaged:
                              type: "boolean"
                        models:
                          type: "array"
                          items:
                            type: "object"
                            required:
                              - "model"
                              - "label"
                              - "enabled"
                              - "custom"
                              - "priority"
                              - "unit"
                              - "window_kind"
                              - "limit"
                              - "threshold_pct"
                              - "used"
                              - "pct"
                              - "state"
                              - "quota"
                              - "tokens"
                              - "resetAt"
                            properties:
                              model:
                                type: "string"
                              label:
                                type: "string"
                              enabled:
                                type: "boolean"
                              custom:
                                type: "boolean"
                              priority:
                                type: "integer"
                              unit:
                                type: "string"
                              window_kind:
                                type: "string"
                              limit:
                                type: "integer"
                              threshold_pct:
                                type: "integer"
                              used:
                                type: "number"
                              pct:
                                type:
                                  - "number"
                                  - "null"
                              state:
                                type: "string"
                                enum:
                                  - "ok"
                                  - "warning"
                                  - "exhausted"
                              quota:
                                type: "boolean"
                              tokens:
                                type: "object"
                                required:
                                  - "input"
                                  - "output"
                                  - "cacheRead"
                                  - "cacheCreation"
                                  - "totalInput"
                                  - "cacheHitPct"
                                  - "unknownRows"
                                properties:
                                  input:
                                    type: "integer"
                                  output:
                                    type: "integer"
                                  cacheRead:
                                    type: "integer"
                                  cacheCreation:
                                    type: "integer"
                                  totalInput:
                                    type: "integer"
                                  cacheHitPct:
                                    type:
                                      - "integer"
                                      - "null"
                                  unknownRows:
                                    type: "integer"
                              resetAt:
                                type: "string"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/usage/turn-composition:
    get:
      summary: "The caller's newest v2 chat turns, with the measured context split (migrations 0040/0044)"
      tags:
        - "providers-usage"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          description: "Clamped to 1-200; the default is 50."
          schema:
            type: "integer"
            default: 50
      responses:
        "200":
          description: "Newest first. Token fields are approximate (chars / 4) for LLM-IDE text and the SDK's own estimates for sdk* fields; null when not measured."
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "turns"
                properties:
                  turns:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "turnId"
                        - "createdAt"
                      description: "One row of turn_composition (migration 0040, 0044), columns camelCased, user_id and id omitted. *Tokens are chars/4 estimates of LLM-IDE text; sdk* are the SDK's own end-of-turn categories. sdkCategories is a 'name:kind=tokens;...' string. resumed is 0 or 1."
                      properties:
                        turnId:
                          type: "string"
                        mode:
                          type:
                            - "string"
                            - "null"
                        model:
                          type:
                            - "string"
                            - "null"
                        resumed:
                          type: "integer"
                          enum:
                            - 0
                            - 1
                        systemPromptKind:
                          type:
                            - "string"
                            - "null"
                        systemChars:
                          type:
                            - "integer"
                            - "null"
                        promptChars:
                          type:
                            - "integer"
                            - "null"
                        attachedFiles:
                          type:
                            - "integer"
                            - "null"
                        attachmentChars:
                          type:
                            - "integer"
                            - "null"
                        images:
                          type:
                            - "integer"
                            - "null"
                        tools:
                          type:
                            - "integer"
                            - "null"
                        mcpTools:
                          type:
                            - "integer"
                            - "null"
                        mcpServers:
                          type:
                            - "string"
                            - "null"
                          description: "comma-separated server names"
                        agents:
                          type:
                            - "integer"
                            - "null"
                        skills:
                          type:
                            - "integer"
                            - "null"
                        slashCommands:
                          type:
                            - "integer"
                            - "null"
                        claudeCodeVersion:
                          type:
                            - "string"
                            - "null"
                        apiCalls:
                          type:
                            - "integer"
                            - "null"
                        firstCallPromptTokens:
                          type:
                            - "integer"
                            - "null"
                        firstCallCacheReadTokens:
                          type:
                            - "integer"
                            - "null"
                        firstCallCacheCreationTokens:
                          type:
                            - "integer"
                            - "null"
                        createdAt:
                          type: "string"
                          description: "SQLite-stored ISO timestamp"
                        systemPromptTokens:
                          type:
                            - "integer"
                            - "null"
                        skillsAppendTokens:
                          type:
                            - "integer"
                            - "null"
                        llmideToolTokens:
                          type:
                            - "integer"
                            - "null"
                        userMcpServers:
                          type:
                            - "integer"
                            - "null"
                        contextFenceTokens:
                          type:
                            - "integer"
                            - "null"
                        memoryFenceTokens:
                          type:
                            - "integer"
                            - "null"
                        skillsFenceTokens:
                          type:
                            - "integer"
                            - "null"
                        toolResultChars:
                          type:
                            - "integer"
                            - "null"
                        toolResultTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkContextTotalTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkSystemPromptTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkSystemToolsTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkMcpToolsTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkMemoryTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkMessagesTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkDeferredToolsTokens:
                          type:
                            - "integer"
                            - "null"
                        sdkCategories:
                          type:
                            - "string"
                            - "null"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /launch-app:
    get:
      tags:
        - "health-auth"
      parameters:
        - name: "to"
          in: "query"
          required: false
          description: "transcript | plan | review | history | settings; any other value falls back to transcript"
          schema:
            type: "string"
        - name: "session"
          in: "query"
          required: false
          description: "appended to the llmide:// target"
          schema:
            type: "string"
      responses:
        "302":
          description: "HTTP 302"
          content:
            text/plain:
              schema:
                type: "string"
  /metrics:
    get:
      summary: "Prometheus scrape target"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Prometheus text-format metrics"
          content:
            text/plain:
              schema:
                type: "string"
        "401":
          description: "Not authenticated"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Admin role required"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    ActivityItem:
      type: "object"
      required:
        - "id"
        - "kind"
        - "title"
        - "detail"
        - "link"
        - "created_at"
      properties:
        id:
          type: "integer"
        kind:
          type: "string"
        title:
          type: "string"
        detail:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "kind-specific detail; open set"
        link:
          type:
            - "string"
            - "null"
        created_at:
          type: "string"
          description: "SQLite datetime (UTC)"
    AgentContext:
      type: "object"
      description: "The Mac client's agent context. The server forwards only these keys (buildEnrichedAgentContext, extension/server/ai-routes.mjs); any other key is dropped. activeProject, indexedRepos entries and recentIssues entries are opaque to this route, so they are open objects."
      properties:
        sessionId:
          type:
            - "string"
            - "null"
        chatSessionId:
          type:
            - "string"
            - "null"
        activeProject:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "The active project as the Mac sends it; opaque here and forwarded unchanged."
        indexedRepos:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
            description: "An indexed repo as the Mac sends it; opaque here."
        recentIssues:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
            description: "A recent issue as the Mac sends it; opaque here."
        workspaceRoot:
          type:
            - "string"
            - "null"
        activeRepoRoot:
          type:
            - "string"
            - "null"
        currentBranch:
          type:
            - "string"
            - "null"
          description: "The active repo's branch, capped at 200 characters."
        gitStatus:
          type:
            - "object"
            - "null"
          description: "Staged and unstaged file counts and the upstream position (the Mac's GitStatus). Rendered per turn as the Git state block."
          properties:
            staged:
              type: "integer"
            unstaged:
              type: "integer"
            ahead:
              type: "integer"
            behind:
              type: "integer"
            hasUpstream:
              type: "boolean"
          additionalProperties: false
    AgentHistoryAgentHistorySummary:
      type:
        - "object"
        - "null"
      description: "Null when the agent store is down."
      required:
        - "rawFromDay"
        - "rawRows"
        - "rolledDays"
        - "oldestDay"
        - "quarantinedAt"
        - "droppedRows"
        - "watermark"
      properties:
        rawFromDay:
          type:
            - "string"
            - "null"
          description: "Oldest raw day (YYYY-MM-DD, local)."
        rawRows:
          type: "integer"
        rolledDays:
          type: "integer"
        oldestDay:
          type:
            - "string"
            - "null"
          description: "Oldest rolled-up day."
        quarantinedAt:
          type:
            - "string"
            - "null"
          description: "When the store was reset after damage, if it was."
        droppedRows:
          type: "integer"
          description: "Rows dropped by the write queue (bounded queue or failed batch), counted since the store was created."
        watermark:
          type:
            - "string"
            - "null"
          description: "The last day folded into the daily rollups."
    AgentHistoryAgentRun:
      type: "object"
      description: "One agent run for the System view. No prompt, message or error text: codes only."
      required:
        - "id"
        - "source"
        - "engine"
        - "status"
        - "startedAt"
        - "endedAt"
        - "durationMs"
        - "tokens"
        - "toolCalls"
        - "model"
        - "errorCode"
      properties:
        id:
          type: "string"
        source:
          type: "string"
          enum:
            - "chat"
            - "loop"
            - "meeting"
            - "autotask"
            - "dispatch"
            - "review"
        engine:
          type:
            - "string"
            - "null"
        status:
          type: "string"
          enum:
            - "running"
            - "ok"
            - "error"
            - "cancelled"
            - "aborted"
        startedAt:
          type: "string"
        endedAt:
          type:
            - "string"
            - "null"
        durationMs:
          type:
            - "integer"
            - "null"
        tokens:
          type: "integer"
          description: "Input plus output tokens of the run."
        toolCalls:
          type: "integer"
        model:
          type:
            - "string"
            - "null"
        errorCode:
          type:
            - "string"
            - "null"
    AgentHistoryStorageGroup:
      type: "object"
      description: "One data group of the Storage hub. agent_history carries bytes (approximate) and the clear/compact actions; the main-DB groups carry rows per user and no bytes (SQLite sizes whole files, not users)."
      required:
        - "key"
        - "label"
        - "rows"
        - "bytes"
        - "bytesApprox"
        - "lastCleanedAt"
        - "retentionDays"
        - "actions"
      properties:
        key:
          type: "string"
          enum:
            - "agent_history"
            - "search_index"
            - "code_graph"
            - "sources"
            - "meetings"
        label:
          type: "string"
        rows:
          type: "integer"
          description: "Rows for this user. agent_history: runs, tool events and composition rows (the rows Clear can delete; the activity feed is not counted). search_index: indexed chunks. code_graph: repos. sources: distinct source kinds. meetings: meetings."
        bytes:
          type:
            - "integer"
            - "null"
          description: "Approximate bytes for agent_history; null for the main-DB groups."
        bytesApprox:
          type:
            - "boolean"
            - "null"
        lastCleanedAt:
          type:
            - "string"
            - "null"
          description: "ISO time of the last clear (agent_history only)."
        retentionDays:
          type:
            - "integer"
            - "null"
          description: "Raw-row retention (agent_history only)."
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "clear"
              - "compact"
          description: "Actions the page may offer. Only agent_history has any."
    AgentHistoryStorageReport:
      type: "object"
      required:
        - "generatedAt"
        - "groups"
        - "agentHistory"
        - "agentStore"
      properties:
        generatedAt:
          type: "string"
        groups:
          type: "array"
          items:
            "$ref": "#/components/schemas/AgentHistoryStorageGroup"
        agentHistory:
          "$ref": "#/components/schemas/AgentHistoryAgentHistorySummary"
        agentStore:
          type: "object"
          required:
            - "health"
            - "state"
          properties:
            health:
              type: "string"
              enum:
                - "ok"
                - "degraded"
                - "down"
            state:
              type: "string"
              enum:
                - "closed"
                - "ok"
                - "down"
    AgentOk:
      type: "object"
      required:
        - "ok"
      properties:
        ok:
          const: true
    AgentUsage:
      type: "object"
      description: "usage of an agent-path /code-assist reply: LegacyUsage plus the memory block size (route.mjs memoryUsage) and, when every model call of the turn reported tokens, the summed turn tokens (kb/usage.mjs turnTokenUsageFields). The memory fields and the token fields are absent in some turns, so they are x-optional."
      properties:
        attachmentCount:
          type: "integer"
        attachmentChars:
          type: "integer"
        paths:
          type: "array"
          items:
            type: "string"
        truncatedPaths:
          type: "array"
          items:
            type: "string"
        memoryChars:
          type: "integer"
        memoryApproxTokens:
          type: "integer"
        memoryHasChatMemory:
          type: "boolean"
        inputTokens:
          type: "integer"
        outputTokens:
          type: "integer"
        cacheReadTokens:
          type: "integer"
        cacheCreationTokens:
          type: "integer"
        modelCalls:
          type: "integer"
    AgentV2Event:
      title: "agent/v2 SSE wire event"
      description: "One `data:` payload on GET/POST /agent/v2/stream. Every variant sets additionalProperties:false ON PURPOSE — a field added server-side must be added here in the same edit, which is what makes scripts/conformance-agent-v2.mjs able to notice that the Mac does not decode it. See SCHEMA.md."
      type: "object"
      required:
        - "type"
      oneOf:
        - title: "init"
          additionalProperties: false
          required:
            - "type"
            - "sessionId"
            - "claudeCodeVersion"
            - "model"
            - "tools"
            - "capabilities"
            - "mcpServers"
          properties:
            type:
              const: "init"
            sessionId:
              type:
                - "string"
                - "null"
            claudeCodeVersion:
              type:
                - "string"
                - "null"
            model:
              type:
                - "string"
                - "null"
            tools:
              type: "array"
              items:
                type: "string"
            capabilities:
              type: "array"
              items:
                type: "string"
            mcpServers:
              type: "array"
              items:
                type: "object"
                additionalProperties: false
                properties:
                  name:
                    type:
                      - "string"
                      - "null"
                  status:
                    type:
                      - "string"
                      - "null"
        - title: "delta"
          additionalProperties: false
          required:
            - "type"
            - "text"
          properties:
            type:
              const: "delta"
            text:
              type: "string"
        - title: "tool_use_start"
          additionalProperties: false
          required:
            - "type"
            - "index"
            - "id"
            - "name"
          properties:
            type:
              const: "tool_use_start"
            index:
              type: "integer"
            id:
              type:
                - "string"
                - "null"
            name:
              type:
                - "string"
                - "null"
        - title: "tool_args_delta"
          additionalProperties: false
          required:
            - "type"
            - "index"
            - "partialJson"
          properties:
            type:
              const: "tool_args_delta"
            index:
              type: "integer"
            partialJson:
              type: "string"
        - title: "tool_result"
          additionalProperties: false
          required:
            - "type"
            - "toolUseId"
            - "isError"
            - "text"
            - "truncated"
          properties:
            type:
              const: "tool_result"
            toolUseId:
              type:
                - "string"
                - "null"
            isError:
              type: "boolean"
            text:
              type: "string"
            truncated:
              type: "boolean"
        - title: "usage"
          additionalProperties: false
          required:
            - "type"
            - "inputTokens"
            - "outputTokens"
            - "cacheReadTokens"
            - "cacheCreationTokens"
          properties:
            type:
              const: "usage"
            inputTokens:
              type: "integer"
            outputTokens:
              type: "integer"
            cacheReadTokens:
              type: "integer"
            cacheCreationTokens:
              type: "integer"
        - title: "memory"
          description: "How much of this turn's prompt is the chat's own session memory. Emitted once, before the query starts, so the client's memory footnote is truthful on this engine (server API v50)."
          additionalProperties: false
          required:
            - "type"
            - "sessionFacts"
            - "chars"
            - "approxTokens"
          properties:
            type:
              const: "memory"
            sessionFacts:
              type: "integer"
            chars:
              type: "integer"
            approxTokens:
              type: "integer"
        - title: "context_usage"
          description: "The SDK's context-window usage after the turn (getContextUsage detail 'summary'), read while the session is still open. Emitted once after `result`, never on a gateway turn, and not at all when the read fails or exceeds 2 s (server API v64)."
          additionalProperties: false
          required:
            - "type"
            - "totalTokens"
            - "maxTokens"
            - "percentage"
            - "categories"
          properties:
            type:
              const: "context_usage"
            totalTokens:
              type: "integer"
            maxTokens:
              type: "integer"
            percentage:
              type: "integer"
            categories:
              type: "array"
              items:
                type: "object"
                additionalProperties: false
                required:
                  - "name"
                  - "kind"
                  - "tokens"
                properties:
                  name:
                    type: "string"
                  kind:
                    type: "string"
                  tokens:
                    type: "integer"
        - title: "result"
          additionalProperties: false
          required:
            - "type"
            - "subtype"
            - "costUsd"
            - "numTurns"
            - "durationMs"
            - "sessionId"
            - "stopReason"
          properties:
            type:
              const: "result"
            subtype:
              type:
                - "string"
                - "null"
            costUsd:
              type:
                - "number"
                - "null"
            numTurns:
              type:
                - "integer"
                - "null"
            durationMs:
              type:
                - "integer"
                - "null"
            sessionId:
              type:
                - "string"
                - "null"
            stopReason:
              type:
                - "string"
                - "null"
        - title: "sdk"
          additionalProperties: false
          required:
            - "type"
            - "sdkType"
            - "subtype"
            - "raw"
          properties:
            type:
              const: "sdk"
            sdkType:
              type:
                - "string"
                - "null"
            subtype:
              type:
                - "string"
                - "null"
            raw: {}
        - title: "approval_request (ToolApproval)"
          additionalProperties: false
          required:
            - "type"
            - "requestId"
            - "kind"
            - "toolName"
            - "argsSummary"
          properties:
            type:
              const: "approval_request"
            requestId:
              type: "string"
            kind:
              const: "ToolApproval"
            toolName:
              type: "string"
            argsSummary:
              type:
                - "string"
                - "null"
            args:
              type: "object"
              additionalProperties: false
              description: "Only for Bash / Edit / Write — engine.mjs approvalArgsFor. Absent for every other gated tool."
              properties:
                command:
                  type: "string"
                filePath:
                  type: "string"
                oldString:
                  type: "string"
                newString:
                  type: "string"
                replaceAll:
                  type: "boolean"
                contentPreview:
                  type: "string"
                totalChars:
                  type: "integer"
                exists:
                  type: "boolean"
                truncated:
                  type: "boolean"
        - title: "approval_request (AskUserQuestion)"
          additionalProperties: false
          required:
            - "type"
            - "requestId"
            - "kind"
            - "questions"
          properties:
            type:
              const: "approval_request"
            requestId:
              type: "string"
            kind:
              const: "AskUserQuestion"
            questions:
              type: "array"
              description: "PASSED THROUGH FROM THE SDK VERBATIM (engine.mjs:906). This is the one place the wire IS the SDK's shape, so an SDK rename lands here first — see SCHEMA.md."
              items:
                type: "object"
                additionalProperties: false
                required:
                  - "question"
                  - "options"
                  - "multiSelect"
                properties:
                  question:
                    type: "string"
                  header:
                    type: "string"
                  multiSelect:
                    type: "boolean"
                  options:
                    type: "array"
                    items:
                      type: "object"
                      additionalProperties: false
                      required:
                        - "label"
                      properties:
                        label:
                          type: "string"
                        description:
                          type: "string"
                        preview:
                          type: "string"
        - title: "approval_resolved"
          additionalProperties: false
          required:
            - "type"
            - "requestId"
            - "outcome"
          properties:
            type:
              const: "approval_resolved"
            requestId:
              type: "string"
            outcome:
              type: "string"
        - title: "mode_set"
          additionalProperties: false
          required:
            - "type"
            - "mode"
          properties:
            type:
              const: "mode_set"
            mode:
              type: "string"
        - title: "tasks"
          additionalProperties: false
          required:
            - "type"
            - "tasks"
            - "continueNeeded"
          properties:
            type:
              const: "tasks"
            tasks:
              type: "array"
              items:
                "$ref": "#/components/schemas/task"
            continueNeeded:
              type: "boolean"
        - title: "tasks_progress"
          additionalProperties: false
          required:
            - "type"
            - "tasks"
          properties:
            type:
              const: "tasks_progress"
            tasks:
              type: "array"
              items:
                "$ref": "#/components/schemas/task"
        - title: "error"
          additionalProperties: false
          required:
            - "type"
            - "code"
            - "message"
            - "retryable"
          properties:
            type:
              const: "error"
            code:
              type: "string"
            message:
              type: "string"
            retryable:
              type: "boolean"
    ApprovalGrant:
      type: "object"
      required:
        - "toolName"
        - "grantedAt"
      properties:
        toolName:
          type: "string"
        grantedAt:
          type: "string"
    ArchiveMessage:
      type: "object"
      required:
        - "seq"
        - "role"
        - "content"
        - "meta"
        - "createdAt"
      properties:
        seq:
          type: "integer"
        role:
          type: "string"
          enum:
            - "user"
            - "assistant"
            - "system"
        content:
          type: "string"
        meta:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "The message metadata the chat store kept, or null."
        createdAt:
          type: "number"
          description: "Seconds since the epoch, as the chat store records it."
    AskMessage:
      type: "object"
      required:
        - "seq"
        - "role"
        - "content"
        - "created_at"
      properties:
        seq:
          type: "integer"
        role:
          type: "string"
          description: "user or assistant"
        content:
          type: "string"
        created_at:
          type: "number"
          description: "epoch seconds with a fraction"
    Attachment:
      type: "object"
      description: "One file attached to a Code Assistant turn. A content starting with '[binary:<media type>]' followed by a newline marks a binary file; an image media type is replaced by a one-line note on the legacy engine."
      properties:
        path:
          type: "string"
        content:
          type: "string"
    AuditItem:
      type: "object"
      required:
        - "id"
        - "action"
        - "resource"
        - "outcome"
        - "detail"
        - "createdAt"
        - "ip"
        - "userAgent"
      properties:
        id:
          type: "integer"
        action:
          type: "string"
        resource:
          type:
            - "string"
            - "null"
        outcome:
          type: "string"
        detail:
          type:
            - "object"
            - "null"
          additionalProperties: true
        createdAt:
          type: "string"
        ip:
          type:
            - "string"
            - "null"
        userAgent:
          type:
            - "string"
            - "null"
    Cancel:
      type:
        - "object"
        - "null"
      description: "How to stop the item: method and path of the existing route, and the JSON body to send. null for an item with no cancel route (a live capture session)."
      properties:
        method:
          type: "string"
          enum:
            - "POST"
        path:
          type: "string"
          enum:
            - "/agent/v2/cancel"
            - "/kb/agent/stop"
        body:
          type: "object"
          properties:
            chatSessionId:
              type: "string"
            sessionId:
              type: "string"
    CatalogEntry:
      type: "object"
      required:
        - "id"
        - "name"
        - "description"
        - "transport"
        - "docsUrl"
        - "registered"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        transport:
          type: "string"
        command:
          type: "string"
        args:
          type: "array"
          items:
            type: "string"
        url:
          type: "string"
        docsUrl:
          type: "string"
        requiresArg:
          type: "object"
          description: "a trailing argument the server cannot work without"
          required:
            - "label"
          properties:
            label:
              type: "string"
            placeholder:
              type: "string"
        credential:
          type: "object"
          description: "the vault key a credential-bearing server reads; values never leave the server"
          properties:
            vaultKey:
              type: "string"
            target:
              type: "string"
            name:
              type: "string"
            label:
              type: "string"
            template:
              type: "string"
        oauth:
          type: "boolean"
        registered:
          type: "boolean"
          description: "already in this install's registry"
    ChatMessage:
      type: "object"
      required:
        - "seq"
        - "role"
        - "content"
        - "meta"
        - "createdAt"
      properties:
        seq:
          type: "integer"
        role:
          type: "string"
          description: "user, assistant or system"
        content:
          type: "string"
        meta:
          type:
            - "object"
            - "null"
          additionalProperties: true
          description: "Caller-supplied metadata stored as sent; the server does not interpret it."
        createdAt:
          type: "number"
    ChatSession:
      description: "A unified chat session (kb/chat-sessions.mjs). createdAt and updatedAt are epoch seconds with a fraction."
      type: "object"
      required:
        - "id"
        - "title"
        - "surface"
        - "mode"
        - "projectId"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "string"
        title:
          type: "string"
        surface:
          type: "string"
          description: "mac, extension or any"
        mode:
          type: "string"
          description: "ask, agent or transcript"
        projectId:
          type:
            - "string"
            - "null"
        createdAt:
          type: "number"
        updatedAt:
          type: "number"
    ClaudeSource:
      type: "object"
      required:
        - "name"
      description: "A server scanned from the operator's ~/.claude.json (CLAUDE_CONFIG_PATH), read-only."
      properties:
        name:
          type: "string"
        transport:
          type: "string"
        command:
          type: "string"
        args:
          type: "array"
          items:
            type: "string"
        env:
          type: "object"
          additionalProperties:
            type: "string"
        url:
          type: "string"
        headers:
          type: "object"
          additionalProperties:
            type: "string"
          description: "values redacted to bullets"
    ClaudeUpdateNotFound:
      type: "object"
      required:
        - "code"
      description: "Deliberately a bare {code} body, not the {error:{...}} envelope: on this route bare bodies are the update outcome protocol the Mac decodes (PluginUpdateOutcome.decode → .notFound), while an envelope means the route itself is missing (older server). Do not wrap it — PluginUpdatePresentationTests.updateOutcomeDecoding guards this."
      properties:
        code:
          type: "string"
        detail:
          type: "string"
    CodeFile:
      type: "object"
      required:
        - "path"
        - "kind"
        - "content"
      properties:
        path:
          type: "string"
        kind:
          type: "string"
          enum:
            - "create"
            - "modify"
        language:
          type: "string"
        content:
          type: "string"
    CodeGraphEdge:
      type: "object"
      properties:
        fromId:
          type: "string"
        toId:
          type: "string"
        kind:
          type: "string"
          description: "CGEdgeKind raw value, e.g. imports / calls / contains"
        confidence:
          type: "string"
    CodeGraphNode:
      type: "object"
      properties:
        id:
          type: "string"
          description: "Required by the server: a node without an id is dropped and counted in droppedNodes."
        title:
          type: "string"
        kind:
          type: "string"
          description: "CGNodeKind raw value, e.g. file / function / classType"
        metadata:
          type: "object"
          properties:
            source_file:
              type: "string"
              description: "Repo-relative path; absolute or ..-bearing values are discarded"
            line:
              type:
                - "integer"
                - "string"
              description: "Mac sends it as a string (CodeGraph metadata is [String:String]); the server normalises with String()."
            language:
              type: "string"
            doc:
              type: "string"
    CodexSource:
      type: "object"
      required:
        - "name"
      description: "A server scanned from the operator's ~/.codex/config.toml (CODEX_CONFIG_PATH), read-only."
      properties:
        name:
          type: "string"
        transport:
          type: "string"
        command:
          type: "string"
        args:
          type: "array"
          items:
            type: "string"
    Command:
      type: "object"
      required:
        - "id"
        - "name"
        - "instruction"
        - "rawContent"
        - "isBuiltin"
        - "folderName"
        - "isProjectCommand"
        - "surface"
      properties:
        id:
          type: "string"
          description: "Stable UUID for the folder (SHA-256 of llmide.doc-command.<folder>, uppercase)."
        name:
          type: "string"
          description: "The first '# ' line, or the humanized folder name."
        instruction:
          type: "string"
          description: "The body without the first '# ' line and the marker line."
        rawContent:
          type: "string"
        isBuiltin:
          const: false
        folderName:
          type: "string"
        isProjectCommand:
          const: true
        surface:
          enum:
            - "doc"
            - "visual"
    CommandWrite:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Title, at most 200 characters. Defaults to the folder name."
        instruction:
          type: "string"
          description: "Instruction text, at most 20 000 characters."
        surface:
          type: "string"
          description: "doc (default) or visual. Any other value answers 400 VALIDATION_FAILED."
        rawContent:
          type: "string"
          description: "The whole file text. When present it is written as-is."
    ConnectorEntry:
      type: "object"
      required:
        - "id"
        - "name"
        - "description"
        - "icon"
        - "authKind"
        - "docsUrl"
        - "pipelineReady"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        description:
          type: "string"
        icon:
          type: "string"
          description: "SF Symbol name"
        authKind:
          type: "string"
          description: "google-oauth | slack-oauth | box-ccg | miro-oauth"
        docsUrl:
          type: "string"
        pipelineReady:
