          items:
            "$ref": "#/components/schemas/DiscoveryItem"
        commands:
          type: "array"
          items:
            "$ref": "#/components/schemas/DiscoveryItem"
        templates:
          type: "array"
          items:
            "$ref": "#/components/schemas/DiscoveryItem"
        hooks:
          type: "array"
          items:
