          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Task not found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      tags:
        - "planning"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                taskId:
                  type: "string"
                patch:
                  type: "object"
                  description: "Only the keys present change; an explicit null clears a field."
                  properties:
                    status:
                      type: "string"
                    risk:
                      type:
                        - "string"
                        - "null"
                    riskReason:
                      type:
                        - "string"
                        - "null"
                    owner:
                      type:
                        - "string"
                        - "null"
                    due:
                      type:
                        - "string"
                        - "null"
                    files:
                      type: "array"
                      items:
                        type: "object"
                        description: "A code-graph file reference (graphkit rollupCodeRefs). Its fields are not exercised by the offline capture: the temp DB has no code index, so code-sync returns empty lists."
