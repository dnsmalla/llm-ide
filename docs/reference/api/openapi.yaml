  /kb/chat/sessions/{id}/archive/begin:
    post:
      tags:
        - "lifecycle"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "after"
          in: "query"
          required: false
          description: "A continuation page: the seq of the last message on the previous page. Needs fence."
          schema:
            type: "integer"
        - name: "fence"
          in: "query"
          required: false
          description: "The fence of the initial begin. Required with after; a mismatch is 409 ARCHIVE_STALE."
          schema:
            type: "integer"
        - name: "limit"
          in: "query"
          required: false
          description: "Messages per page: default 200, at most 500. A page is also cut at about 8 MB."
          schema:
            type: "integer"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "fence"
                  - "count"
                  - "hash"
                  - "incomplete"
                  - "session"
                  - "messages"
                  - "nextAfter"
                properties:
                  fence:
                    type: "integer"
                    description: "Bumped by every begin. The commit must present it."
                  count:
                    type: "integer"
                  hash:
                    type: "string"
                    description: "64 lower-case hex: the digest of ALL the chat's messages, streamed (not just this page)."
                  session:
                    type: "object"
                    required:
                      - "id"
                      - "title"
                      - "surface"
                      - "mode"
                      - "projectId"
                      - "createdAt"
                      - "updatedAt"
                    properties:
                      id:
                        type: "string"
                      title:
                        type: "string"
                      surface:
                        type: "string"
                      mode:
                        type: "string"
                      projectId:
                        type:
                          - "string"
                          - "null"
                      createdAt:
                        type: "number"
                      updatedAt:
                        type: "number"
                  messages:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/ArchiveMessage"
                    description: "Every message, in order. No cap (plan Q8)."
                  incomplete:
                    type: "object"
                    required:
                      - "incomplete"
                      - "prunedMessages"
                      - "truncatedMessages"
                    properties:
                      incomplete:
                        type: "boolean"
                        description: "True when the live store dropped messages (the 2000-message prune or the 64 KB content cap). The commit refuses unless acceptIncomplete is sent."
                      prunedMessages:
                        type: "integer"
                      truncatedMessages:
                        type: "integer"
                  nextAfter:
                    type:
                      - "integer"
                      - "null"
                    description: "The seq to pass as after for the next page, or null on the last page."
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/chat/sessions/{id}/archive/commit:
    post:
      tags:
        - "lifecycle"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "fence"
                - "hash"
              properties:
                fence:
                  type: "integer"
                hash:
                  type: "string"
                  description: "The 64-hex hash the begin returned, recomputed over the file the Mac wrote."
                acceptIncomplete:
                  type: "boolean"
                  description: "Archive a chat the caps made incomplete. Without it such a commit is 409 INCOMPLETE_ARCHIVE."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "deleted"
                  - "status"
                properties:
                  deleted:
                    type: "boolean"
                    description: "True when this call removed the rows."
                  status:
                    type: "string"
                    enum:
                      - "deleted"
                      - "already_archived"
                    description: "already_archived: the chat is gone and a receipt with this hash says it was archived (idempotent). A chat that is gone without such a receipt is 404."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not Found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
