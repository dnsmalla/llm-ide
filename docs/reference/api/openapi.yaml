      description: "Tenancy-checked: the deciding user must own the session the approval was parked under; foreign decisions are 403 and logged. An AskUserQuestion is answered with `answers`; a ToolApproval with `action`. A ToolApproval's approval_request carries an optional `suggestion` { toolName, pattern?, scope: project|session, label } — what `always-allow` would save: a project command-prefix / tool rule, or (edits) a grant for this chat."
