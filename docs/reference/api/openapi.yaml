  /agent/v2/stream:
    post:
      summary: "Run one Agent-SDK chat turn and stream its events over SSE"
      description: "The server owns the chat→SDK-session mapping: consecutive turns with the same `agentContext.chatSessionId` resume the same SDK conversation. `fresh: true` deliberately skips the recorded id (client asked to start over, e.g. after a SESSION_UNRESUMABLE error). Validation errors answer as plain JSON before the SSE headers are written; once streaming, failures arrive as a terminal `data: {\"type\":\"error\",...}` event instead of an HTTP status."
      tags:
        - "agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "message"
                - "agentContext"
              properties:
                message:
                  type: "string"
                  description: "User message. Fence sentinels are neutralised, then capped at 120 000 chars; the message and attachments share one 150 000-char turn budget, message first. An over-cap message is truncated and the model is told so in-band, not rejected."
                agentContext:
                  type: "object"
                  required:
                    - "chatSessionId"
                    - "workspaceRoot"
                  properties:
                    chatSessionId:
                      type: "string"
                      description: "Mac chat session id — the mapping key"
                    workspaceRoot:
                      type: "string"
                      description: "Workspace the engine roots its reads in"
                mode:
                  type: "string"
                  description: "Chat mode; plan/assist_plan map to SDK plan permission mode; ask = read-only quick chat (menu bar / sheet / phone): no file edits, no shell, no git actions"
                language:
                  type: "string"
                model:
                  type: "string"
                  description: "Model id from the picker, passed to the SDK verbatim (an Anthropic id, or the custom provider's own id on a gateway turn); omitted = config default"
                provider:
                  type: "string"
                  description: "Provider the turn runs on (server v43+): `anthropic` (default when omitted) or an Anthropic-compatible custom provider `custom:<uuid>` registered with an `anthropicBaseURL`. The engine points the Agent SDK at that endpoint with the provider's own key and meters the turn under this id. Any other value fails before the SDK spawns with a terminal error event coded `PROVIDER_NOT_AGENT_CAPABLE` (no Anthropic-compatible endpoint) or `PROVIDER_UNAVAILABLE` (unregistered / disabled / no key)."
                effort:
                  type: "string"
                skills:
                  type: "array"
                  items:
                    type: "string"
                  description: "Invoked skill ids (max 5); bodies are prompt-injected"
                planExecute:
                  type: "boolean"
                  description: "Set only by the Mac saved-plan card's \"Execute plan\" action: this Execute turn is working an already-approved plan, so the server injects the plan-execution skill (subagent-driven-development when the user has subagents, executing-plans otherwise). Omitted on every other request."
                planWrite:
                  type: "boolean"
                permissionMode:
                  type: "string"
                  description: "Claude Code's modes. `ask` (default; `manual` is its old spelling): prompt-tier calls park an approval unless a saved project rule covers them. `accept-edits`: in-workspace Edit/Write run unasked, shell still asks. `bypass`: nothing that would park asks. No mode lifts the blocklist or write containment."
                attachments:
                  type: "array"
                  items:
                    type: "object"
                  description: "File attachments (max 30 files, 80 000 chars each, 200 000 total)"
                fresh:
                  type: "boolean"
                  description: "Skip the recorded SDK session id and start a new one"
                history:
                  type: "array"
                  items:
                    type: "object"
                  description: "read only when fresh is true"
      responses:
        "200":
          description: "SSE stream of engine events — init first, mode_set right after init, result or error last. Event types: init, delta, tool_use_start, tool_args_delta, tool_result, usage, approval_request, approval_resolved, mode_set, result, error, sdk. Unknown event types and fields must be ignored by clients."
          content:
            text/event-stream:
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/AgentV2Event"
        "400":
          description: "Missing message / chatSessionId / workspaceRoot"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
