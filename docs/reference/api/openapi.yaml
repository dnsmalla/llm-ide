                          type:
                            - "string"
                            - "null"
                        effortLevels:
                          type: "array"
                          items:
                            type: "string"
                    description: "anthropic via the Agent SDK only"
                  source:
                    const: "sdk"
                    description: "Present when the list came from the Agent SDK"
        "400":
          description: "Unknown provider"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/providers/verify:
