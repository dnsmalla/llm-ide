  /kb/plan/save:
    post:
      summary: "Create or update a plan without an LLM call (manual / auto-stub)"
      tags:
        - "planning"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "savePlan input. id is optional (generated when absent). Tasks are replaced wholesale on every save."
              properties:
                id:
                  type: "string"
                  description: "Omit to create a new plan"
                title:
                  type: "string"
                goal:
                  type: "string"
                language:
                  type: "string"
                meetingId:
                  type: "string"
                meta:
                  type: "object"
                  additionalProperties: true
                  description: "Stored as plan meta."
                tasks:
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      id:
                        type: "string"
                      title:
                        type: "string"
                      description:
                        type: "string"
                      owner:
                        type: "string"
                      due:
                        type: "string"
                      estimateDays:
                        type: "number"
                      dependsOn:
                        type: "array"
                        items:
                          type: "string"
                      status:
                        type: "string"
                      risk:
                        type: "string"
                      riskReason:
                        type: "string"
                      milestone:
                        type: "string"
                      files:
                        type: "array"
                        items:
                          type: "object"
                          description: "A code-graph file reference (graphkit rollupCodeRefs). Its fields are not exercised by the offline capture: the temp DB has no code index, so code-sync returns empty lists."
                          properties:
                            ref:
                              type: "string"
                            title:
                              type: "string"
                            bodyExcerpt:
                              type: "string"
                            rank:
                              type: "number"
                      symbols:
                        type: "array"
                        items:
                          type: "object"
                          description: "A code-graph symbol row (kb/code-graph.mjs hydrateSymbols). Not exercised offline: no SCIP index in the temp DB."
                          properties:
                            symbol_id:
                              type: "string"
                            title:
                              type: "string"
                            kind:
                              type: "string"
                            repo_id:
                              type: "string"
                            source_file:
                              type: "string"
                            line:
                              type: "integer"
                      meta:
                        type: "object"
                        additionalProperties: true
                        description: "Stored task meta."
      responses:
        "200":
          description: "Saved plan"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "id"
                  - "title"
                  - "createdAt"
                  - "updatedAt"
                  - "tasks"
                  - "meta"
                properties:
                  id:
                    type: "string"
                  meetingId:
                    type:
                      - "string"
                      - "null"
                  title:
                    type: "string"
                  goal:
                    type:
                      - "string"
                      - "null"
                  language:
                    type:
                      - "string"
                      - "null"
                  meta:
                    type: "object"
                    additionalProperties: true
                    description: "Free-form plan meta; savePlan keeps meta.snapshots (last 3 versions) on update."
                  createdAt:
                    type: "string"
                  updatedAt:
                    type: "string"
                  tasks:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/PlanTask"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "SQLite write failed (code SAVE_FAILED)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
