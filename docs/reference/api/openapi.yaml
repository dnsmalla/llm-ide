          type: "integer"
        byState:
          type: "object"
          additionalProperties: true
          description: "outcome count per state; open set, empty when no outcomes exist"
    Payload:
      type: "object"
      additionalProperties: true
      description: "The kind-specific payload, open because its shape depends on kind. Submit keeps only the keys listed for the kind (kb/review-payload.mjs REVIEW_PAYLOAD_KEYS) and removes credential-looking keys (token, apiKey, secret, password, credential, auth, bearer, authorization) at every depth; every review response returns the payload scrubbed the same way. dispatch: target (github, backlog or linear; preview never reaches review), planId, taskIds, config (tracker credentials and settings: repo, space, projectId, issueTypeId, teamId; credential keys are stripped), and items, which the server replaces with the plan's tasks at submit and approve (title, body). codegen-apply: repoPath, taskId, summary, files and tests (each {path, content}), pr (ghRepo, baseBranch; credential keys are stripped), and allowedRepos, which the server sets from the user's allow-list at submit and approve. The server never trusts a client-sent allowedRepos or items."
    Persona:
      description: "A row of the multi-persona registry (kb/personas.mjs). id 'default' is the migrated legacy persona."
      type: "object"
