                  reason:
                    type: "string"
                    description: "set only when attached is false: already-attached"
        "400":
          description: "Dispatch failed"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent/feedback:
