          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Plan generation failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/index/notes:
    post:
      tags:
        - "index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "notes"
              properties:
                projectId:
                  type: "string"
                notes:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Note"
                  description: "At most 50 per batch (BATCH_TOO_LARGE, 400); a body over 1 MB is 413 PAYLOAD_TOO_LARGE; a note body over 512 KiB is a 400."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "upserted"
                  - "unchanged"
                  - "skippedHidden"
                  - "truncated"
                  - "removed"
                properties:
                  upserted:
                    type: "integer"
                    description: "Rows written (new or changed)."
                  unchanged:
                    type: "integer"
                    description: "Rows whose content already matched; nothing was written."
                  skippedHidden:
                    type: "integer"
                  truncated:
                    type: "integer"
                    description: "Rows whose body was capped at 200 KiB."
                  removed:
                    type: "integer"
                    description: "Rows removed because the note is now hidden (it was indexed while visible)."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/index/notes/{key}:
    delete:
      tags:
        - "index"
      parameters:
        - name: "key"
          in: "path"
          required: true
          description: "The note key, percent-encoded."
          schema:
            type: "string"
        - name: "projectId"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "deleted"
                properties:
                  deleted:
                    type: "boolean"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/index/reconcile:
    post:
      tags:
        - "index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "manifest"
              properties:
                projectId:
                  type: "string"
                manifest:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/ManifestEntry"
                  description: "At most 20 000 entries."
                prune:
                  type: "boolean"
                  description: "true deletes the extra rows. Default false: report only."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "missing"
                  - "stale"
                  - "extra"
                  - "pruned"
                properties:
                  missing:
                    type: "array"
                    items:
                      type: "string"
                    description: "In the manifest, not indexed."
                  stale:
                    type: "array"
                    items:
                      type: "string"
                    description: "Indexed with a different content hash."
                  extra:
                    type: "array"
                    items:
                      type: "string"
                    description: "Indexed, not in the manifest."
                  pruned:
                    type: "integer"
                    description: "Rows deleted (only with prune true)."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/index/scan:
    post:
      tags:
        - "index"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "scanId"
                - "index"
                - "total"
                - "entries"
              properties:
                projectId:
                  type: "string"
                scanId:
                  type: "string"
                  description: "8 to 64 letters, digits or dashes; one value per scan, chosen by the client."
                index:
                  type: "integer"
                  description: "0-based chunk number, below total."
                total:
                  type: "integer"
                  description: "Chunks in the scan (1 to 100). Every chunk of one scan repeats it."
                complete:
                  type: "boolean"
                  description: "true on the final chunk: the scan is compared with the index. Default false."
                prune:
                  type: "boolean"
                  description: "true (final chunk only) deletes the rows no chunk named. Default false."
                entries:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/ManifestEntry"
                  description: "At most 500 per chunk."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "missing"
                  - "stale"
                  - "extra"
                  - "pruned"
                  - "received"
                  - "total"
                  - "complete"
                properties:
                  missing:
                    type: "array"
                    items:
                      type: "string"
                    description: "Keys in this chunk that the index lacks."
                  stale:
                    type: "array"
                    items:
                      type: "string"
                    description: "Keys in this chunk indexed with another hash."
                  extra:
                    type: "array"
                    items:
                      type: "string"
                    description: "Final chunk only: indexed keys no chunk named."
                  pruned:
                    type: "integer"
                    description: "Final chunk with prune: rows deleted."
                  received:
                    type: "integer"
                    description: "Chunks of this scan received so far."
                  total:
                    type: "integer"
                  complete:
                    type: "boolean"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
