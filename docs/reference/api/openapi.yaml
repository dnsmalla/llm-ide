  /kb/agent-history/clear:
    post:
      tags:
        - "agent-history"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "scope"
              properties:
                scope:
                  type: "string"
                  enum:
                    - "raw"
                    - "all"
                beforeDays:
                  type:
                    - "integer"
                    - "null"
                  description: "Only rows older than this many days; omit for all."
                dryRun:
                  type: "boolean"
                  description: "Default true: a dry run. false performs the clear and needs previewId."
                previewId:
                  type: "string"
                  description: "From a dry run of the same scope and cutoff."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    required:
                      - "dryRun"
                      - "scope"
                      - "beforeDays"
                      - "wouldDelete"
                      - "total"
                      - "previewId"
                      - "expiresAt"
                    properties:
                      dryRun:
                        type: "boolean"
                        const: true
                      scope:
                        type: "string"
                        enum:
                          - "raw"
                          - "all"
                      beforeDays:
                        type:
                          - "integer"
                          - "null"
                      wouldDelete:
                        type: "object"
                        required:
                          - "agent_runs"
                          - "agent_tool_events"
                          - "turn_composition"
                          - "agent_daily"
                          - "agent_daily_tools"
                        properties:
                          agent_runs:
                            type: "integer"
                          agent_tool_events:
                            type: "integer"
                          turn_composition:
                            type: "integer"
                          agent_daily:
                            type: "integer"
                          agent_daily_tools:
                            type: "integer"
                      total:
                        type: "integer"
                      previewId:
                        type: "string"
                        description: "Signed by the server; valid five minutes for this user, scope and cutoff."
                      expiresAt:
                        type: "string"
                  - type: "object"
                    required:
                      - "dryRun"
                      - "scope"
                      - "beforeDays"
                      - "deleted"
                      - "total"
                    properties:
                      dryRun:
                        type: "boolean"
                        const: false
                      scope:
                        type: "string"
                        enum:
                          - "raw"
                          - "all"
                      beforeDays:
                        type:
                          - "integer"
                          - "null"
                      deleted:
                        type: "object"
                        required:
                          - "agent_runs"
                          - "agent_tool_events"
                          - "turn_composition"
                          - "agent_daily"
                          - "agent_daily_tools"
                        properties:
                          agent_runs:
                            type: "integer"
                          agent_tool_events:
                            type: "integer"
                          turn_composition:
                            type: "integer"
                          agent_daily:
                            type: "integer"
                          agent_daily_tools:
                            type: "integer"
                      total:
                        type: "integer"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflict"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "Not yet specified: Store unavailable or disk short: the status is set by the route (routes/agent-history.mjs); the Error envelope is the same as the other 4xx/5xx answers and needs a store outage to produce, so no fixture captures it."
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
