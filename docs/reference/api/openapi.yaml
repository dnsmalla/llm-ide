        content:
          application/json:
            schema:
              type: "object"
              description: "message and transcript are required in effect (400 when either is missing, or empty after sanitization). message is capped at 10 000 characters; history uses the last 10 turns, each capped at 5 000 characters. The user's Meeting-agent persona, when set, prefixes the prompt."
              properties:
