                  type: "boolean"
                  description: "Replace the repo's existing graph rows; default true."
      responses:
        "200":
          description: "Ingest counts"
        "400":
          description: "Missing args or SCIP index failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Repo path not on the allow-list"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
