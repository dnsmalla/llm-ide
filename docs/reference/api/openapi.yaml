        - "status"
      properties:
        status:
          enum:
            - "pending"
            - "complete"
            - "error"
            - "unknown"
          description: "unknown: the state is expired or was never issued"
        teamName:
          type: "string"
        channels:
          type: "array"
          items:
            type: "object"
            description: "channels found for the connected workspace"
        message:
          type: "string"
    Source:
      type: "object"
      description: "One selected source for /generate-doc. name is the display name (sanitized to one line, 80 chars); content is the source text, budgeted by packSources."
      properties:
        name:
          type: "string"
        content:
          type: "string"
    Stats:
      type: "object"
      required:
        - "meetings"
        - "entities"
        - "sources"
        - "plans"
        - "tasks"
        - "reviews"
        - "outcomes"
      properties:
        meetings:
          type: "integer"
        entities:
          type: "integer"
        sources:
          type: "object"
          required:
            - "code"
            - "ticket"
            - "qa"
            - "lastIndexed"
          additionalProperties: true
          description: "one count per indexed source kind; the open set includes code, ticket and qa and any kind added later"
          properties:
            code:
              type: "integer"
            ticket:
              type: "integer"
            qa:
              type: "integer"
            lastIndexed:
              type: "object"
              additionalProperties:
                type: "string"
              description: "last index time per kind, SQLite datetime (UTC)"
        plans:
          type: "integer"
        tasks:
          type: "integer"
        reviews:
          "$ref": "#/components/schemas/Reviews"
        outcomes:
          "$ref": "#/components/schemas/Outcomes"
    SystemStatus:
      type: "object"
      required:
        - "stats"
        - "flow"
      properties:
        stats:
          "$ref": "#/components/schemas/Stats"
        flow:
          type: "object"
          required:
            - "capture"
            - "agent"
            - "review"
            - "outcomes"
          properties:
            capture:
              type: "object"
              required:
                - "activeCount"
                - "sessions"
              properties:
                activeCount:
                  type: "integer"
                sessions:
                  type: "array"
                  items:
                    type: "object"
                    additionalProperties: true
                    description: "one active capture session; not pinned, none was active when captured"
            agent:
              type: "object"
              required:
                - "activeCount"
                - "runs"
              properties:
                activeCount:
                  type: "integer"
                runs:
                  type: "array"
                  items:
                    type: "object"
                    additionalProperties: true
                    description: "one agent run; not pinned, none was active when captured"
            review:
              type: "object"
              required:
                - "pendingCount"
                - "byStatus"
                - "pendingItems"
              properties:
                pendingCount:
                  type: "integer"
                byStatus:
                  "$ref": "#/components/schemas/Reviews"
                pendingItems:
                  type: "array"
                  items:
                    type: "object"
                    additionalProperties: true
                    description: "one pending review item; not pinned, none was pending when captured"
            outcomes:
              "$ref": "#/components/schemas/Outcomes"
    TaskFeedback:
      type: "object"
      required:
        - "planTaskId"
        - "total"
        - "byVerdict"
        - "usefulRate"
        - "avgScoreUseful"
        - "avgScoreNoise"
      properties:
        planTaskId:
          type: "string"
        total:
          type: "integer"
        byVerdict:
          "$ref": "#/components/schemas/VerdictCounts"
        usefulRate:
          type:
            - "number"
            - "null"
        avgScoreUseful:
          type:
            - "number"
            - "null"
        avgScoreNoise:
          type:
            - "number"
            - "null"
    Template:
      type: "object"
      required:
        - "id"
        - "name"
        - "sections"
        - "rawContent"
        - "isBuiltin"
        - "folderName"
        - "isProjectTemplate"
        - "surface"
      properties:
        id:
          type: "string"
          description: "Stable UUID for the folder (SHA-256 of llmide.doc-template.<folder>, uppercase)."
        name:
          type: "string"
          description: "The '# Title' line, or the humanized folder name."
        sections:
          type: "array"
          items:
            type: "string"
          description: "The '## ' headings, or ['Content'] when there are none."
        rawContent:
          type: "string"
          description: "The file text exactly as stored."
        isBuiltin:
          const: false
        folderName:
          type: "string"
        isProjectTemplate:
          const: true
        surface:
          enum:
            - "doc"
            - "visual"
    TemplateWrite:
      type: "object"
      properties:
        name:
          type: "string"
          description: "Title, at most 200 characters. Defaults to the folder name."
        sections:
          type: "array"
          items:
            type: "string"
          description: "Section headings, at most 100 of 200 characters each. Used when rawContent is absent."
        surface:
          type: "string"
          description: "doc (default) or visual. Any other value answers 400 VALIDATION_FAILED."
        rawContent:
          type: "string"
          description: "The whole file text. When present it is written as-is (the Swift renderedMarkdown rule), and it wins over rewrite."
        rewrite:
          type: "boolean"
          description: "Apply name and sections to the existing file and keep its body text (DocTemplate.rewriting). Precedence: rawContent wins. When rawContent is present it is written as-is and rewrite is ignored."
    TicketIndex:
      type: "object"
      required:
        - "ok"
        - "count"
        - "chunks"
      properties:
        ok:
          const: true
        count:
          type: "integer"
        chunks:
          type: "integer"
    TokenBreakdown:
      type: "object"
      required:
        - "input"
        - "output"
        - "cacheRead"
        - "cacheCreation"
        - "totalInput"
        - "cacheHitPct"
        - "unknownRows"
      properties:
        input:
          type: "integer"
        output:
          type: "integer"
        cacheRead:
          type: "integer"
        cacheCreation:
          type: "integer"
        totalInput:
          type: "integer"
        cacheHitPct:
          type:
            - "integer"
            - "null"
        unknownRows:
          type: "integer"
    ToolApprovalListing:
      type: "object"
      required:
        - "rules"
        - "approvals"
      properties:
        rules:
          type: "array"
          items:
            "$ref": "#/components/schemas/ToolRule"
        approvals:
          type: "array"
          description: "pre-0034 global grants, no longer honoured by either engine, still listed and revocable"
          items:
            "$ref": "#/components/schemas/ApprovalGrant"
    ToolRule:
      type: "object"
      required:
        - "projectRoot"
        - "toolName"
        - "pattern"
        - "grantedAt"
      properties:
        projectRoot:
          type: "string"
          description: "Absolute workspace root the rule applies to"
        toolName:
          type: "string"
          description: "`Bash`, `run-bash`, or an act tool name"
        pattern:
          type: "string"
          description: "Command prefix for shell tools; empty = the whole tool"
        grantedAt:
          type: "string"
          description: "ISO-8601 timestamp"
    Turn:
      type: "object"
      description: "One prior chat turn. role is 'user' or 'assistant'; the server maps any other role to 'Assistant' in the /chat prompt."
      properties:
        role:
          type: "string"
        content:
          type: "string"
    UsageCounts:
      type: "object"
      required:
        - "calls"
        - "runs"
        - "input"
        - "output"
        - "cacheRead"
        - "cacheWrite"
        - "billable"
      properties:
        calls:
          type: "integer"
        runs:
          type: "integer"
        input:
          type: "integer"
        output:
          type: "integer"
        cacheRead:
          type: "integer"
        cacheWrite:
          type: "integer"
        billable:
          type: "integer"
    User:
      type: "object"
      required:
        - "id"
        - "email"
        - "displayName"
        - "role"
        - "status"
        - "createdAt"
        - "lastLoginAt"
      properties:
        id:
          type: "string"
        email:
          type: "string"
        displayName:
          type: "string"
        role:
          type: "string"
          description: "admin | user"
        status:
          type: "string"
        createdAt:
          type: "string"
          description: "SQLite datetime, YYYY-MM-DD HH:MM:SS (UTC), not ISO 8601"
        lastLoginAt:
          type:
            - "string"
            - "null"
          description: "SQLite datetime, or null before the first login"
    VerdictCounts:
      type: "object"
      required:
        - "useful"
        - "noise"
        - "later"
      properties:
        useful:
          type: "integer"
        noise:
          type: "integer"
        later:
          type: "integer"
    WellKnown:
      type: "object"
      required:
        - "issuer"
        - "registrationOpen"
        - "vaultKeys"
        - "accessTokenTTLSec"
      properties:
        issuer:
          type: "string"
        registrationOpen:
          type: "boolean"
        vaultKeys:
          type: "array"
          items:
            type: "string"
          description: "names of the secrets a user may store"
        accessTokenTTLSec:
          type: "integer"
    WorkingChat:
      type: "object"
      required:
        - "chatSessionId"
        - "sdkSession"
        - "factCount"
        - "updatedAt"
      properties:
        chatSessionId:
          type: "string"
          description: "The Mac chat UUID."
        sdkSession:
          type:
            - "string"
            - "null"
          description: "The Agent SDK session the chat resumes, when one is mapped."
        factCount:
          type: "integer"
          description: "Session-memory facts kept for the chat."
        updatedAt:
          type:
            - "string"
            - "null"
          description: "ISO time the chat's SDK mapping was last used; null when only facts remain."
    task:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "title"
        - "status"
      properties:
        id:
          type: "string"
        title:
          type: "string"
        status:
          type: "string"
