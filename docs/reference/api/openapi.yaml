                  title:
                    type: "string"
                  goal:
                    type:
                      - "string"
                      - "null"
                  language:
                    type:
                      - "string"
                      - "null"
                  meta:
                    type: "object"
                    additionalProperties: true
                    description: "Free-form plan meta; savePlan keeps meta.snapshots (last 3 versions) on update."
                  createdAt:
                    type: "string"
                  updatedAt:
                    type: "string"
