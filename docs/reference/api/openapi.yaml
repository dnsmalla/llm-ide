      summary: "Verify an LLM provider credential (live probe or CLI binary check)"
      tags:
        - "providers-usage"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "provider is required (an unknown or empty one answers 400). mode 'cli' checks the provider's CLI binary; any other value is the key mode. apiKey, when absent, is the stored key. baseUrl is read only for provider custom."
              properties:
                provider:
                  type: "string"
                  description: "Provider ID (e.g. anthropic, openai, custom)"
                mode:
                  type: "string"
                  description: "key | cli"
                apiKey:
                  type: "string"
                  description: "placeholder in fixtures; never a real key"
                baseUrl:
                  type: "string"
                  description: "Required for provider=custom"
      responses:
        "200":
          description: "Verification result (always 200; check ok field)"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "detail"
                properties:
                  ok:
                    type: "boolean"
                  detail:
                    type: "string"
        "400":
          description: "Unknown provider"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/review/approve:
    post:
      summary: "Execute an approved review item (re-runs guardrails)"
      tags:
        - "review"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "id is required by the handler (400 VALIDATION_FAILED 'Missing id'). config and pr carry credentials for this approval only (vault < held from submit < these); they are never stored or echoed. A dispatch item needs a tracker credential; without one the answer is 422 CREDENTIAL_REQUIRED."
              properties:
                id:
                  type: "string"
                note:
                  type: "string"
                  description: "Stored as reviewerNote."
                config:
                  type: "object"
                  additionalProperties: true
                  description: "API v75+. Credentials for the dispatch target (github token / backlog or linear apiKey); highest precedence, never persisted. Without one the server uses a value held from submit, then the per-user vault."
                pr:
                  type: "object"
                  additionalProperties: true
                  description: "API v75+. codegen-apply only: PR credentials (ghToken); same precedence as config."
      responses:
        "200":
          description: "executed. API v75+: review payloads in all /kb/review/* responses are redacted (token/apiKey/secret/password leaves removed)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ReviewItem"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
