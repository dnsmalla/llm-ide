                taskIds:
                  type: "array"
                  items:
                    type: "string"
                reviewId:
                  type: "string"
                  description: "Required when target != preview"
                config:
                  type: "object"
                  description: "Destination and credential keys for the target (repo/owner for github, space/projectId for backlog, teamId/projectId for linear). Credentials come from the vault unless sent here. Open: the keys are per target."
                  additionalProperties: true
                  properties:
                    repo:
                      type: "string"
      responses:
        "200":
          description: "ok"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "target"
                  - "plan"
                  - "results"
                properties:
                  target:
                    type: "string"
                  plan:
                    type: "object"
                    required:
                      - "id"
                      - "title"
                    properties:
                      id:
                        type: "string"
                      title:
                        type: "string"
                  results:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "taskId"
                        - "status"
                      properties:
                        taskId:
                          type: "string"
                        status:
                          type: "string"
                        title:
                          type: "string"
                        body:
                          type: "string"
                        labels:
                          type: "array"
                          items:
                            type: "string"
                        assignees:
                          type: "array"
                          items:
                            type: "string"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "Forbidden"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: "Conflict. Code REVIEW_CONFIG_MISMATCH (API v75+) when the request `config` names a destination (e.g. repo) different from the approved review; credentials in `config` are still accepted"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
