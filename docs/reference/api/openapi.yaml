  /generate-doc:
    post:
      summary: "Generate a structured Markdown document from a template and/or a command, over source content"
      tags:
        - "notes-generation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "Gate (validateDocRequest): a template (templateName plus a non-empty sections array) or a non-empty command, and a non-empty sources array; otherwise 400. The total source budget is 400 000 rendered characters (packSources); sections are capped at 30, the prompt field at 2 000 characters, the command at 10 000. Sources not fitting the budget are listed in omitted, and shortened ones in truncated."
              properties:
                templateName:
                  type: "string"
                  description: "Document title / template identifier"
                sections:
                  type: "array"
                  items:
                    type: "string"
                  description: "Ordered list of section headings (max 30); required together with templateName"
                command:
                  type: "string"
                  description: "Reusable instruction text from a Doc Gen \"command\" .md file; alone satisfies the templateName+sections requirement"
                prompt:
                  type: "string"
                  description: "Freeform one-off instructions from the prompt bar; combined with template/command, never required on its own"
                sources:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Source"
                  description: "Source material; non-empty is required, not just present. No item-count limit — sources are capped at 50 000 chars each and the RENDERED source block (headings included) is fitted to a 400 000-char total budget by equal-share water-filling; anything shortened is named in the response's truncated array, and anything that could not be given at least 200 chars is named in omitted"
      responses:
        "200":
          description: "Generated markdown document"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "content"
                  - "truncated"
                  - "truncatedCount"
                  - "omitted"
                  - "omittedCount"
                properties:
                  content:
                    type: "string"
                    description: "Full markdown document"
                  truncated:
                    type: "array"
                    items:
                      type: "string"
                    description: "Names of the sources the total-character budget forced short, capped at 50 entries (server API v52; absent on older servers, which silently kept only the first 20 sources)"
                  truncatedCount:
                    type: "integer"
                    description: "Exact number of shortened sources; never capped, so it can exceed truncated.length"
                  omitted:
                    type: "array"
                    items:
                      type: "string"
                    description: "Names of the sources that did not fit the budget at all and were not sent, capped at 50 entries (server API v52). Dropped from the end of the request array, so the client decides what survives by the order it sends"
                  omittedCount:
                    type: "integer"
                    description: "Exact number of omitted sources; never capped, so it can exceed omitted.length"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
