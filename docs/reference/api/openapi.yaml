          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Internal Server Error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /code-assist:
    post:
      summary: "Code-assist chat with optional file attachments"
      description: "With `Accept: text/event-stream` the answer streams as SSE events (`progress`, `chunk`, `done`, `tasks`, `error`). A turn that fails because the named provider cannot run (missing / disabled / keyless, or its CLI is missing, broken or logged out) before ANY progress or chunk event went out sends `{ type: 'error', error, code: 'PROVIDER_UNAVAILABLE' }` (API v70+) — the buffered path's 400 with the same code — so a client can retry once without its tier route. Every other error event has no `code`."
      tags:
        - "notes-generation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "message is required in effect (400 when missing or empty after sanitization). message is capped at 20 000 characters; attachments are budgeted by selectAttachments (30 files, 80 000 characters each, 200 000 in total). history is windowed to the context budget. skills are ids read from the local skills library; unknown ids are ignored. tier 'subagent' selects LLMIDE_SUBAGENT_MODEL when model is absent. With agentContext the agent loop runs (agent path); without it, one model call runs (legacy path). 8 MB body limit (readBody). The SSE form (Accept: text/event-stream) is not specified here: its events are progress, chunk, done (reply, pendingTool, usage, mode), tasks (tasks, continueNeeded) and error (error, optional code), and no event schema exists for them."
              properties:
                message:
                  type: "string"
                  description: "User message (max 20 000 chars after sanitization)"
                history:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Turn"
                attachments:
                  type: "array"
                  items:
                    "$ref": "#/components/schemas/Attachment"
                  description: "File attachments (max 30 files, 80 000 chars each, 200 000 total)"
                skills:
                  type: "array"
                  items:
                    type: "string"
                language:
                  type: "string"
                model:
                  type: "string"
                provider:
                  type: "string"
                  description: "A provider id, or custom:<uuid>. A provider without a configured key answers 400 PROVIDER_UNAVAILABLE."
                tier:
                  type: "string"
                  description: "'subagent' or absent."
                mode:
                  type: "string"
                  description: "Chat mode; plan/assist_plan map to SDK plan permission mode; ask = read-only quick chat (menu bar / sheet / phone): no file edits, no shell, no git actions"
                planExecute:
                  type: "boolean"
                  description: "Set only by the Mac saved-plan card's \"Execute plan\" action: this Execute turn is working an already-approved plan, so the server injects the plan-execution skill (subagent-driven-development when the user has subagents, executing-plans otherwise). Omitted on every other request."
                planWrite:
                  type: "boolean"
                clientCaps:
                  type: "array"
                  items:
                    type: "string"
                agentContext:
                  "$ref": "#/components/schemas/AgentContext"
      responses:
        "200":
          description: "Assistant reply"
          content:
            application/json:
              schema:
                oneOf:
                  - type: "object"
                    required:
                      - "reply"
                      - "usage"
                      - "continueNeeded"
                      - "tasks"
                      - "mode"
                    description: "Agent path (route.mjs handleCodeAssist result, plus memoryUsage merged into usage and the task state)."
                    properties:
                      reply:
                        type: "string"
                      pendingTool:
                        type:
                          - "object"
                          - "null"
                        additionalProperties: true
                        description: "A tool call waiting for the user's approval, or null. Its keys come from the model's tool call, so the object is open."
                      usage:
                        "$ref": "#/components/schemas/AgentUsage"
                      continueNeeded:
                        type: "boolean"
                      tasks:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/NotesGenerationTask"
                      mode:
                        type: "string"
                        description: "The resolved mode of the turn."
                  - type: "object"
                    required:
                      - "reply"
                      - "usage"
                    description: "Legacy path: one model call, no tools."
                    properties:
                      reply:
                        type: "string"
                        description: "The model's reply, trimmed."
                      usage:
                        "$ref": "#/components/schemas/LegacyUsage"
        "400":
          description: "Validation error, or (API v67+) PROVIDER_UNAVAILABLE — the named provider is missing, disabled or has no API key; message is the Settings hint"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "Upstream LLM error (error code INTERNAL_ERROR)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /code-assist/decision:
    post:
      summary: "Answer a parked act-tool approval from a legacy /code-assist stream"
      description: "The legacy-engine counterpart of POST /agent/v2/decision, backed by the same in-process decision registry. A 'prompt'-tier run-bash command parks an approval and emits a progress event of phase `approval_request`; this route resolves it. Tenancy-checked: the deciding user AND the session the approval was parked under (the legacy chat's `agentContext.sessionId`) must both match, or the answer is 403."
      tags:
        - "notes-generation"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "Resolves a run-bash approval parked by the legacy engine (llm_agent/sdk/decisions.mjs answerDecision). action defaults to 'answer' when answers is present. An unknown action, or an unparseable body (treated as {}), answers 404 DECISION_UNKNOWN. 64 KB body limit (not declared, see the group description)."
              properties:
                requestId:
                  type: "string"
                  description: "Id from the approval_request progress event"
                sdkSessionId:
                  type: "string"
                  description: "The legacy chat's agentContext.sessionId."
                action:
                  enum:
                    - "answer"
                    - "allow"
                    - "deny"
                    - "always-allow"
                  description: "'always-allow' saves the rule the approval_request's `suggestion` offered — a project-scoped command-prefix rule for shell commands (`npm test`), a project-scoped tool rule for act tools — so later prompt-tier calls it covers skip the approval. No `suggestion` (a compound command) means it allows once."
                feedback:
                  type: "string"
                  description: "With `deny` only: the user's instruction (\"No, and do this instead\"), handed to the model as the denial reason. Max 2000 chars."
                answers:
                  type: "object"
                  additionalProperties: true
                  description: "AskUserQuestion answers, forwarded to the engine unchanged."
      responses:
        "200":
          description: "Decision delivered; the parked tool call resumes (or is denied) and the stream continues"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotesGenerationOk"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: "DECISION_FORBIDDEN — belongs to another user or session"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "DECISION_EXPIRED / DECISION_UNKNOWN — nothing pending"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
