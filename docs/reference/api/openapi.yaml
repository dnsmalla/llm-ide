              schema:
                "$ref": "#/components/schemas/Error"
  /kb/routing-tiers:
    get:
      summary: "The caller's tier routing config plus per-tier usability (API v67+)"
      description: "The stored config and, for each tier, whether the server can run it right now — the same check the server's resolver applies (custom provider registered/enabled/keyed; DeepSeek keyed; OpenAI/Google keyed or, API v68+, their CLI installed for the logged-in subscription path; v69+: the CLI must pass a `--version` health probe, which this request may wait a few seconds for) — and whether it can run on the Agent SDK engine (first-party Anthropic, or a custom provider with an Anthropic-compatible endpoint and a key). The Mac app uses it to skip a route the server would refuse."
      tags:
        - "providers-usage"
      responses:
        "200":
          description: "Config + status"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "tiers"
                  - "features"
                  - "status"
                  - "featureStatus"
                properties:
                  tiers:
                    type: "object"
                    additionalProperties:
                      type: "object"
                      required:
                        - "provider"
                        - "model"
                      properties:
                        provider:
                          type: "string"
                          description: "anthropic | openai | google | deepseek | jev | custom:<id>"
                        model:
                          type: "string"
                    description: "Keys strong | standard | cheap."
                  features:
                    type: "object"
                    additionalProperties:
                      type: "string"
                      description: "strong | standard | cheap"
                    description: "Role -> tier."
                  status:
                    type: "object"
                    additionalProperties:
                      type: "object"
                      required:
                        - "usable"
                        - "agentCapable"
                      properties:
                        usable:
                          type: "boolean"
                        reason:
                          type: "string"
                          description: "unset | not_found | disabled | no_key | no_key_or_cli (OpenAI/Google, v68+) | cli_unverified (CLI health probe not run yet, v69+) | cli_failed / route_failed (the route failed at runtime in the last ~10 min, v69+) | error (only when usable is false)"
                        agentCapable:
                          type: "boolean"
                        agentReason:
                          type: "string"
                          description: "why the Agent engine cannot run a usable tier, e.g. not_agent_capable"
                        via:
                          type: "string"
                          enum:
                            - "key"
                            - "cli"
                          description: "API v68+, only when usable. `key` = runs on an API key (user vault or operator env; custom providers always), `cli` = runs on the provider's logged-in CLI subscription (claude / codex / gemini). A key wins when both exist."
                    description: "Keys: configured tiers, plus unset ones (reason unset) when a tier is absent."
                  featureStatus:
                    type: "object"
                    additionalProperties:
                      type: "object"
                      required:
                        - "usable"
                      properties:
                        usable:
                          type: "boolean"
                        reason:
                          type: "string"
                          description: "set when unusable: a tier reason, cli_untrusted_input, or decision_only"
                    description: "API v69+. One entry per CONFIGURED feature. `usable: false` with the tier's own reason when the tier is unusable, or `cli_untrusted_input` when the tier runs on a keyless codex/gemini CLI and the feature is `internal` or `pipeline` (untrusted email/connector/transcript input; pipeline output is dispatched to issue trackers), or `decision_only` (API v73+) when the tier runs on `jev` and the feature is anything but `decisions`."
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      summary: "Sync the Mac app's per-role tier routing config to the server"
      description: "Replaces the CALLER's tier routing config (other users are untouched), persisted per user. Each tier names a provider + model; each feature names a tier. Every entry is optional and invalid entries are dropped (unknown tier/feature names, a provider outside anthropic|openai|google|deepseek|jev|custom:<id>, a model id outside `^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}(\\[1m\\])?$`) and reported back in `dropped` (API v67+). An unset or unusable tier (custom provider missing/disabled/keyless, DeepSeek without an API key, OpenAI/Google with neither an API key nor their logged-in CLI — codex/gemini, API v68+; v67 required the key) keeps the role on its default provider and model. API v73+: `jev` (decision-only, key required) is a valid tier provider but serves ONLY the `decisions` feature; any other feature on a jev tier keeps its default."
      tags:
        - "providers-usage"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: "The whole routing table; the server replaces the user's table. Invalid entries are dropped, not rejected (see dropped). A body that is not a JSON object answers 400 (no type is declared so that refusal can be exemplified)."
              properties:
                tiers:
                  type: "object"
                  additionalProperties:
                    type: "object"
                    required:
                      - "provider"
                      - "model"
                    properties:
                      provider:
                        type: "string"
                        description: "anthropic | openai | google | deepseek | jev | custom:<id>"
                      model:
                        type: "string"
                  description: "Keys strong | standard | cheap"
                features:
                  type: "object"
                  additionalProperties:
                    type: "string"
                  description: "Keys subagents | loop | autoTasks | quickChat | pipeline | internal | decisions (API v73+); values a tier name"
      responses:
        "200":
          description: "Synced"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "success"
                  - "dropped"
                properties:
                  success:
                    type: "boolean"
                  dropped:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "entry"
                        - "reason"
                      properties:
                        entry:
                          type: "string"
                          description: "tiers.<name> or features.<name>"
                        reason:
                          type: "string"
                          enum:
                            - "invalid_shape"
                            - "invalid_provider"
                            - "invalid_model"
                            - "unknown_tier"
                            - "unknown_feature"
                    description: "Entries that were not stored (API v67+)"
        "400":
          description: "Body is not a JSON object"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "405":
          description: "Method not allowed"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "413":
          description: "Request body too large"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/search:
    get:
      summary: "Tenant-scoped FTS5 + empty-query unified search"
      tags:
        - "kb-sources"
      parameters:
        - name: "q"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "kind"
          in: "query"
          required: false
          description: "One of meeting, action, decision, blocker, code, ticket, qa, doc, plan, task or outcome; any other value searches every kind."
          schema:
            type: "string"
        - name: "limit"
          in: "query"
          required: false
          description: "Capped at 100; zero, negative or non-numeric values give the default 20."
          schema:
            type: "integer"
            default: 20
        - name: "projectId"
          in: "query"
          required: false
          description: "Ignored unless it is a safe id (1-128 letters, digits, underscores or hyphens)."
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_-]{1,128}$"
      responses:
        "200":
          description: "Search results"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "results"
                properties:
                  results:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/SearchHit"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/session-purges:
    post:
      tags:
        - "lifecycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "chatSessionId"
              properties:
                chatSessionId:
                  type: "string"
                reason:
                  type: "string"
                  description: "user_delete (default) or meeting_end. Any other value is a 400 VALIDATION_FAILED."
      responses:
        "202":
          description: "Accepted"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "queued"
                  - "purged"
                properties:
                  queued:
                    const: true
                    description: "The tombstone is durable before the purge is attempted."
                  purged:
                    type: "string"
                    enum:
                      - "done"
                      - "pending"
                      - "failed"
                    description: "done: working state, transcripts and server chat rows are gone. pending: retried later with backoff. failed: gave up after the attempt cap (see working-state)."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
