                "$ref": "#/components/schemas/Error"
  /kb/agent-sdk:
    get:
      summary: "The backend's Claude Agent SDK version against the npm registry's latest"
      tags:
        - "providers-usage"
      parameters:
        - name: "force"
          in: "query"
          required: false
          description: "Bypass the 1 h latest-version cache"
          schema:
            type: "string"
      responses:
        "200":
          description: "`running` is what this process loaded at startup, `installed` what is on disk (they differ after an update until the backend restarts — `restartNeeded`). `canUpdate` is false while remote access is on."
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "package"
                  - "running"
                  - "installed"
                  - "declared"
                  - "restartNeeded"
                  - "latest"
                  - "updateAvailable"
                  - "updating"
                  - "canUpdate"
                  - "error"
                properties:
                  package:
                    type: "string"
                  running:
                    type:
                      - "string"
                      - "null"
                  installed:
                    type:
                      - "string"
                      - "null"
                  declared:
                    type:
                      - "string"
                      - "null"
                  restartNeeded:
                    type: "boolean"
                  latest:
                    type:
                      - "string"
                      - "null"
                  updateAvailable:
                    type: "boolean"
                  updating:
                    type: "boolean"
                  canUpdate:
                    type: "boolean"
                  error:
                    type:
                      - "string"
                      - "null"
                    description: "Why the registry could not be checked"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent-sdk/update:
    post:
      summary: "Install the registry's latest Claude Agent SDK in this backend's checkout"
      description: "Runs `npm install @anthropic-ai/claude-agent-sdk@<latest> --save-exact`, then loads the new package in a separate process; if either fails the previous version is reinstalled. Never restarts the backend — the client does. One update at a time; refused while a chat turn is running, and /agent/v2/stream answers 503 SDK_UPDATING while it runs; refused while remote access is on unless LLMIDE_ALLOW_SDK_UPDATE=1."
      tags:
        - "providers-usage"
      responses:
        "200":
          description: "Always 200; `ok` says whether it updated"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "from"
                  - "to"
                  - "rolledBack"
                  - "restartNeeded"
                  - "log"
                properties:
                  ok:
                    type: "boolean"
                  from:
                    type:
                      - "string"
                      - "null"
                  to:
                    type:
                      - "string"
                      - "null"
                  rolledBack:
                    type: "boolean"
                  restartNeeded:
                    type: "boolean"
                  log:
                    type:
                      - "string"
                      - "null"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
