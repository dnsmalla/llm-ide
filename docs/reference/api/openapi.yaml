  /kb/agent/project-memory:
    get:
      summary: "Auto-captured chat-memory facts for a repo (project-memory viewer)"
      description: "Send the client's indexedRepos candidate paths; the server resolves the FIRST allow-listed one — the same target memory capture writes to — and returns its absolute root so subsequent DELETEs address the same file. A repo that is not on the caller's allow-list yields `{ facts: [], repo: null }` without touching disk."
      tags:
        - "agent"
      parameters:
        - name: "repo"
          in: "query"
          required: false
          description: "Candidate repo path; repeatable, tried in order."
          schema:
            type: "array"
            items:
              type: "string"
        - name: "workspaceRoot"
          in: "query"
          required: false
          description: "Open Explorer folder, tried after the repo candidates."
          schema:
            type: "string"
      responses:
        "200":
          description: "Facts plus the resolved root"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "facts"
                  - "repo"
                properties:
                  facts:
                    type: "array"
                    items:
                      type: "string"
                  repo:
                    type:
                      - "string"
                      - "null"
                    description: "the resolved absolute root, or null when no candidate is allow-listed"
    delete:
      summary: "Remove one captured fact, or clear a repo's captured facts"
      tags:
        - "agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "repo"
              properties:
                repo:
                  type: "string"
                  description: "Absolute root from the GET above"
                workspaceRoot:
                  type: "string"
                fact:
                  type: "string"
                  description: "one fact to remove, by its identity"
                all:
                  type: "boolean"
                  description: "true clears every fact of the repo"
      responses:
        "200":
          description: "The remaining facts"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "facts"
                properties:
                  facts:
                    type: "array"
                    items:
                      type: "string"
        "404":
          description: "Repo not on the caller's allow-list"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent/runs:
    get:
      summary: "List sessions that currently have the agent attached"
      tags:
        - "agent"
      responses:
        "200":
          description: "Active agent runs"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "runs"
                properties:
                  runs:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "sessionId"
                        - "planId"
                        - "startedAt"
                        - "lastTickAt"
                        - "lastDecision"
                      properties:
                        sessionId:
                          type: "string"
                        planId:
                          type:
                            - "string"
                            - "null"
                        startedAt:
                          type: "number"
                          description: "epoch milliseconds"
                        lastTickAt:
                          type:
                            - "number"
                            - "null"
                        lastDecision:
                          type:
                            - "object"
                            - "null"
                          description: "the loop's last candidate decision (agents/meeting-agent.mjs recordDecision); null until the loop has judged one"
                          properties:
                            reason:
                              type: "string"
                            score:
                              type:
                                - "number"
                                - "null"
                            asked:
                              type: "boolean"
                          required:
                            - "reason"
                            - "score"
                            - "asked"
  /kb/agent/session-memory:
    get:
      tags:
        - "agent"
      parameters:
        - name: "sessionId"
          in: "query"
          required: true
          description: "the chat's id; a blank value answers 400"
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "facts"
                properties:
                  facts:
                    type: "array"
                    items:
                      type: "string"
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      summary: "Delete everything session memory captured for one chat session"
      description: "Called when the user clears or deletes a chat, so its captured memory does not outlive it. A real DB delete (kb/session-memory.mjs, table `session_memory`) — distinct from project memory (`/kb/agent/project-memory`, above), which is durable and never touched by a session's lifecycle, only its own explicit per-fact edit/delete. Not repo-scoped, so no allow-list resolution is involved."
      tags:
        - "agent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "sessionId"
              properties:
                sessionId:
                  type: "string"
                  description: "Chat session UUID (AgentContext.chatSessionId)"
      responses:
        "200":
          description: "How many facts were dropped"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "removed"
                properties:
                  removed:
                    type: "integer"
        "400":
          description: "sessionId missing"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent/skill-library:
    get:
      summary: "Central skills-repo discovery catalog (skills the agent cannot execute)"
      description: "The `skills/` + `runtime/` families NOT already in /kb/agent/catalog. The client attaches a chosen skill's SKILL.md to the next request as context."
      tags:
        - "agent"
      responses:
        "200":
          description: "Skill library"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "repo"
                  - "skills"
                properties:
                  repo:
                    type:
                      - "string"
                      - "null"
                    description: "Central skills repo path"
                  skills:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/SkillLibraryEntry"
  /kb/agent/stop:
    post:
      summary: "Detach the meeting agent from a live session"
      tags:
        - "agent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                sessionId:
                  type: "string"
      responses:
        "200":
          description: "Stop result"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "stopped"
                properties:
                  stopped:
                    type: "boolean"
                  reason:
                    type: "string"
                    description: "set only when stopped is false: unknown-session or forbidden"
        "400":
          description: "Missing sessionId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent/tool-approvals:
    get:
      summary: "The caller's \"always allow\" permission rules"
      description: "Claude-style rules made from the approval card's \"always allow\" button: per user, per project (the resolved workspace root), per tool, and for shell tools per command PREFIX (`npm test`, `git status`). A compound command never matches a prefix rule. A rule only ever skips the interactive approval a `prompt`-tier call would park; it can never promote a `blocked` command or a write outside the workspace, because those checks run first and unconditionally. `approvals` are the pre-v55 global per-tool grants: no longer honoured by either engine, still listed so they can be seen and revoked."
      tags:
        - "agent"
      responses:
        "200":
          description: "The caller's rules"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ToolApprovalListing"
    delete:
      summary: "Revoke one rule, one legacy grant, or everything"
      description: "Revocation only ever removes permission — the tool simply asks again — so there is nothing to gate. Returns the remaining set so a caller re-renders from the server's own view."
      tags:
        - "agent"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                projectRoot:
                  type: "string"
                  description: "with toolName and pattern: one project rule"
                toolName:
                  type: "string"
                  description: "alone: one legacy global grant"
                pattern:
                  type: "string"
                all:
                  type: "boolean"
                  description: "Revoke every rule and legacy grant"
      responses:
        "200":
          description: "The remaining rules and grants, and how many were removed"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "rules"
                  - "approvals"
                  - "removed"
                properties:
                  rules:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/ToolRule"
                  approvals:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/ApprovalGrant"
                  removed:
                    type: "integer"
        "400":
          description: "Nothing to revoke was named"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/agent/working-state:
    get:
      tags:
        - "lifecycle"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "sessions"
                  - "purges"
                properties:
                  sessions:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/WorkingChat"
                  purges:
                    type: "object"
                    required:
                      - "pending"
                      - "failed"
                    properties:
                      pending:
                        type: "integer"
                        description: "Tombstones still retrying (with backoff)."
                      failed:
                        type: "array"
                        description: "Tombstones that gave up after the attempt cap; resolve them, they do not retry."
                        items:
                          type: "object"
                          required:
                            - "chatSessionId"
                            - "attempts"
                          properties:
                            chatSessionId:
                              type: "string"
                            attempts:
                              type: "integer"
  /kb/analyze-risks:
    post:
      summary: "Re-compute LLM risk assessment for a plan"
      tags:
        - "planning"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              description: "Exactly one of planId or plan is read (planId wins). planId persists the result; plan returns it without saving."
              properties:
                planId:
                  type: "string"
                plan:
                  type: "object"
                  description: "A client-supplied plan draft. The server reads title, goal, language, meetingId and each task's id, title, description, owner, estimateDays, dependsOn, status."
                  properties:
                    title:
                      type: "string"
                    goal:
                      type: "string"
                    language:
                      type: "string"
                    meetingId:
                      type: "string"
                    tasks:
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          id:
                            type: "string"
                          title:
                            type: "string"
                          description:
                            type: "string"
                          owner:
                            type: "string"
                          estimateDays:
                            type: "number"
                          dependsOn:
                            type: "array"
                            items:
                              type: "string"
                          status:
                            type: "string"
                language:
                  type: "string"
      responses:
        "200":
          description: "Plan with risk fields updated"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "tasks"
                properties:
                  id:
                    type: "string"
                  meetingId:
                    type:
                      - "string"
                      - "null"
                  title:
                    type: "string"
                  goal:
                    type:
                      - "string"
                      - "null"
                  language:
                    type:
                      - "string"
                      - "null"
                  meta:
                    type: "object"
                    additionalProperties: true
                    description: "Free-form plan meta; savePlan keeps meta.snapshots (last 3 versions) on update."
                  createdAt:
                    type: "string"
                  updatedAt:
                    type: "string"
                  tasks:
                    type: "array"
                    items:
                      "$ref": "#/components/schemas/PlanningTask"
        "400":
          description: "Validation error"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Plan not found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Rate limited"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "500":
          description: "Risk analysis failed (RISK_ANALYSIS_FAILED)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/archive-receipts:
    post:
      tags:
        - "lifecycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "chatSessionId"
                - "hash"
                - "count"
              properties:
                chatSessionId:
                  type: "string"
                hash:
                  type: "string"
                  description: "64 lower-case hex: the archive hash the Mac computed over the file it wrote."
                count:
                  type: "integer"
                  description: "Messages in that file."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "recorded"
                properties:
                  recorded:
                    const: true
                    description: "The receipt is stored; purging the chat's working state is now allowed."
        "400":
          description: "Bad Request"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/box/test:
    post:
      summary: "Verify Box credentials and folder access"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                clientId:
                  type: "string"
                subjectType:
                  type: "string"
                  description: "user | enterprise (default enterprise)"
                subjectId:
                  type: "string"
                folderId:
                  type: "string"
      responses:
        "200":
          description: "Folder info"
