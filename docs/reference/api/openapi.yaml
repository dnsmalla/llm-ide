  /kb/loop/agent-run:
    post:
      summary: "Run one headless, confined agent step for the Mac Loop"
      description: "The Loop's skill stages, stage repairs and fault repairs. Runs on the Claude Agent SDK with FILE TOOLS ONLY (Read, Glob, Grep, Edit, Write) plus one read-only code-graph search, `mcp__llmide__find-code`, served in-process (strict MCP config: no user, project or plugin MCP server can join), working directory `repoRoot`, and every path confined to it (symlinks resolved; secret paths such as `.env` and `.git/` refused). No shell, no network, no plugins, no operator settings. A step that repeats itself or keeps failing is stopped as `no_progress`. Nothing is ever parked for approval: a refused tool call is denied and listed in `denied`. `repoRoot` must be absolute and either at or below a root on the caller's repo allow-list (`/auth/me/repos`) or a linked git worktree of one under a `.llmide-loop-worktrees/` or `loop-worktrees/` directory. `extraRoots` (at most 4) widens the confinement to a project's notes directory in the split layout: each must be an existing directory named `llm-doc` whose parent contains `system/project.json` and is `repoRoot` itself or an ancestor of it at most 3 levels up (symlinks resolved); anything else is 400 `EXTRA_ROOT_NOT_ALLOWED`. Grep and Glob patterns naming a secret path are refused, and every Grep carries the secret denylist as negative globs. A run cut off by the timeout or a disconnect is still metered for the usage the SDK reported. When any requested skill id is not installed the agent does not run (`ran: false`, the id in `unresolvedSkills`). `timeoutMs` (default 30 min, clamped to 1 s – 4 h) aborts the run; a client disconnect aborts it too. Rate-limited on the `agentTurn` bucket. `provider` (v66, the Mac's Loop tier route) runs the step on an Anthropic-compatible custom provider through its Anthropic base URL and key (the same gateway contract as `/agent/v2/stream`); the tools and confinement are identical for every provider, and the run is metered under the provider that ran. Absent means first-party Anthropic. Server API v58 (provider: v66)."
      tags:
        - "live-loop-misc"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                message:
                  type: "string"
                  description: "The composed Loop instruction (max 200000 chars)"
                skills:
                  type:
                    - "array"
                    - "string"
                  items:
                    type: "string"
                  description: "a string is refused with 400 (must be an array of ids)"
                repoRoot:
                  type: "string"
                  description: "Absolute path of the run's git root (the worktree in worktree mode)"
                extraRoots:
                  type: "array"
                  items:
                    type: "string"
                  description: "Absolute paths of project llm-doc/ directories the run may also read and edit (split layout)"
                language:
                  type: "string"
                model:
                  type: "string"
                provider:
                  type: "string"
                  description: "\"anthropic\" or an Anthropic-compatible \"custom:<id>\" (one with an anthropicBaseURL). Absent = first-party Anthropic"
                timeoutMs:
                  type: "number"
      responses:
        "200":
          description: "The run finished (or did not start because a skill is missing — see `ran`)"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "reply"
                  - "changedPaths"
                  - "changedExtraPaths"
                  - "createdPaths"
                  - "usage"
                  - "resolvedSkills"
                  - "unresolvedSkills"
                  - "truncatedSkills"
                  - "ran"
                  - "resultSubtype"
                  - "denied"
                properties:
                  reply:
                    type: "string"
                    description: "The agent's closing summary"
                  changedPaths:
                    type: "array"
                    items:
                      type: "string"
                    description: "Repo-relative paths the agent's Edit/Write calls changed"
                  changedExtraPaths:
                    type: "array"
                    items:
                      type: "string"
                    description: "Absolute paths changed inside an accepted extra root"
                  createdPaths:
                    type: "array"
                    items:
                      type: "string"
                    description: "The subset of changedPaths a Write created (the file did not exist before the call)"
                  usage:
                    "$ref": "#/components/schemas/LoopUsage"
                  resolvedSkills:
                    type: "array"
                    items:
                      type: "string"
                  unresolvedSkills:
                    type: "array"
                    items:
                      type: "string"
                  truncatedSkills:
                    type: "array"
                    items:
                      type: "string"
                    description: "Resolved skills longer than the cap; only their head was sent"
                  ran:
                    type: "boolean"
                  resultSubtype:
                    type:
                      - "string"
                      - "null"
                    description: "The SDK result subtype (success, error_max_turns, …), or no_progress when LLM-IDE stopped the step: the same tool call repeated more than three times with no file change in between, or five tool calls in a row failed."
                  denied:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "toolName"
                        - "reason"
                      properties:
                        toolName:
                          type: "string"
                        reason:
                          type: "string"
                  noProgressReason:
                    type: "string"
                    description: "Present only with resultSubtype no_progress — why the step was stopped"
        "400":
          description: "VALIDATION_FAILED, REPO_ROOT_NOT_ALLOWED — repoRoot outside the allow-list, EXTRA_ROOT_NOT_ALLOWED — an extraRoots entry is not the project's llm-doc, PROVIDER_UNAVAILABLE — the custom provider is missing, disabled or keyless, or PROVIDER_NOT_AGENT_CAPABLE — the provider has no Anthropic-compatible endpoint"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "feature_disabled — LLMIDE_FEATURES omits auto_tasks; the route module is not loaded"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FeatureDisabled"
        "502":
          description: "INTERNAL_ERROR — the engine failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "503":
          description: "NO_KEY — no Anthropic credentials"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "504":
          description: "AGENT_RUN_TIMEOUT — timeoutMs elapsed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/mcp-connector/classify:
    post:
      summary: "Classify one ingested connector item and extract to-dos"
      description: "Accepts the Source Connector manifest engine's fixed `{ body: { …fields } }` envelope; the connector id rides inside the field map as `connectorId`."
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                body:
                  type: "object"
                  properties:
                    connectorId:
                      type: "string"
                    title:
                      type: "string"
                    date:
                      type: "string"
                    text:
                      type: "string"
      responses:
        "200":
          description: "Classification"
        "400":
          description: "Missing body.text"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "The model did not return valid JSON"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/mcp-connector/fetch:
    post:
      summary: "Fetch new items from a remote MCP connector (server-side dedup against the seen ledger)"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                limit:
                  type: "integer"
                  description: "1 to 200"
      responses:
        "200":
          description: "Items not yet imported. Partial success — one unreadable parent is reported in `failures`, not as an error."
        "400":
          description: "Unknown connector id, not connected (MCP_UNAUTHORIZED), or no fetch mapping (MCP_NOT_FETCHABLE)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "MCP fetch failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/mcp-connector/seen:
    post:
      summary: "Mark MCP connector item ids as imported (per user, per connector)"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                itemIds:
                  type: "array"
                  items:
                    type: "string"
      responses:
        "200":
          description: "Marked"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "ok"
                  - "marked"
                properties:
                  ok:
                    const: true
                  marked:
                    type: "integer"
                    description: "Rows actually inserted; re-marking is a no-op"
        "400":
          description: "Unknown connector id"
          x-undeclared: true
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/mcp-connector/test:
    post:
      summary: "Verify a remote MCP connector's saved OAuth tokens (connect + tools/list)"
      tags:
        - "kb-sources"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                id:
                  type: "string"
                  description: "connector id from mcp-connector-defs (for example miro)"
      responses:
        "200":
          description: "Connected — server identity and available tools"
        "400":
          description: "Unknown connector id"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "502":
          description: "MCP connection failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/meeting/{id}:
    get:
      summary: "Fetch a single meeting record by ID"
      tags:
        - "kb-sources"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            pattern: "^[A-Za-z0-9_-]{1,128}$"
        - name: "include"
          in: "query"
          required: false
          description: "Opt-in extras. `transcript` adds the stored transcript text as `transcript`."
          schema:
            type: "string"
            enum:
              - "transcript"
      responses:
        "200":
          description: "Meeting record"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Meeting"
        "400":
          description: "Invalid ID format"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Not found"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/notify/slack:
    post:
      summary: "Send a plan / dispatch / custom message via Slack incoming webhook"
      tags:
        - "planning"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                kind:
                  type: "string"
                webhookUrl:
                  type: "string"
                  description: "Optional — vault key slack.webhookUrl is preferred"
                planId:
                  type: "string"
                payload:
                  type: "object"
                  additionalProperties: true
                  description: "Per kind: a plan, a dispatch result, a review, or {text} for custom."
      responses:
        "200":
          description: "ok"
        "400":
          description: "Missing kind, no webhook configured, or notify failed"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Unauthorized"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Plan not found (when kind=plan)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: "Too Many Requests"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/os/state:
    get:
      summary: "System view aggregate (read-only, no model call)"
      description: "The Agentic OS view in one read: the feature set and kit table with each kit enabled or not, the /health checks, this user's running chat turns, meeting-agent runs and live sessions (each with its cancel call), recent activity, token usage for a day or a week (by model, source and endpoint, with the turn-composition averages), and knowledge counts (sources, outcomes, pending reviews, code-graph freshness, project memory). Every value is this user's and is read from data already recorded."
      tags:
        - "os"
      parameters:
        - name: "window"
          in: "query"
          required: false
          description: "day (default) or week; any other value is a 400 VALIDATION_FAILED."
          schema:
            type: "string"
        - name: "activity"
          in: "query"
          required: false
          description: "How many activity rows to return: a positive integer, default 30, capped at 100. Any other value falls back to 30."
          schema:
            type: "string"
      responses:
        "200":
          description: "The System view aggregate"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "generatedAt"
                  - "apiVersion"
                  - "system"
                  - "running"
                  - "activity"
                  - "tokens"
                  - "knowledge"
                  - "macOnly"
                  - "storage"
                  - "agents"
                properties:
                  generatedAt:
                    type: "string"
                    description: "ISO 8601 time the aggregate was built."
                  apiVersion:
                    type: "integer"
                    description: "SERVER_API_VERSION of this server."
                  system:
                    type: "object"
                    required:
                      - "features"
                      - "kits"
                      - "status"
                      - "checks"
                    properties:
                      features:
                        type:
                          - "array"
                          - "null"
                        description: "The sorted enabled LLMIDE_FEATURES keys, or null when every feature is on."
                        items:
                          type: "string"
                      kits:
                        type: "array"
                        items:
                          "$ref": "#/components/schemas/KitStatus"
                      status:
                        type: "string"
                        enum:
                          - "ok"
                          - "degraded"
                        description: "Same as /health: ok when the DB, the Claude CLI and the skills checks all pass."
                      checks:
                        type: "object"
                        required:
                          - "db"
                          - "claude"
                          - "skills"
                        properties:
                          db:
                            type: "boolean"
                          claude:
                            type: "boolean"
                          claudeError:
                            type: "string"
                          skills:
                            type: "boolean"
                          skillsError:
                            type: "string"
                  running:
                    type: "object"
                    required:
                      - "chatTurns"
                      - "meetingAgentRuns"
                      - "liveSessions"
                    properties:
                      chatTurns:
                        type: "array"
                        description: "This user's v2 chat turns running now (the in-process turn lock). Cancel: POST /agent/v2/cancel."
                        items:
                          type: "object"
                          required:
                            - "chatSessionId"
                            - "startedAt"
                            - "cancel"
                          properties:
                            chatSessionId:
                              type: "string"
                            startedAt:
                              type: "string"
                            cancel:
                              "$ref": "#/components/schemas/Cancel"
                      meetingAgentRuns:
                        type: "array"
                        description: "This user's meeting-agent runs attached to a capture session. Cancel: POST /kb/agent/stop."
                        items:
                          type: "object"
                          required:
                            - "sessionId"
                            - "planId"
                            - "startedAt"
                            - "lastTickAt"
                            - "cancel"
                          properties:
                            sessionId:
                              type: "string"
                            planId:
                              type:
                                - "string"
                                - "null"
                            startedAt:
                              type:
                                - "string"
                                - "null"
                            lastTickAt:
                              type:
                                - "string"
                                - "null"
                            cancel:
                              "$ref": "#/components/schemas/Cancel"
                      liveSessions:
                        type: "array"
                        description: "This user's live caption sessions not yet finalized. No cancel route: a session ends when its capture client stops."
                        items:
                          type: "object"
                          required:
                            - "sessionId"
                            - "meetingTitle"
                            - "startedAt"
                            - "lastWrite"
                            - "captionCount"
                            - "cancel"
                          properties:
                            sessionId:
                              type: "string"
                            meetingTitle:
                              type:
                                - "string"
                                - "null"
                            startedAt:
                              type:
                                - "string"
                                - "null"
                            lastWrite:
                              type:
                                - "string"
                                - "null"
                            captionCount:
                              type: "integer"
                            cancel:
                              type: "null"
                              description: "Always null: a live capture session has no cancel route (it ends when its capture client stops)."
                  activity:
                    type: "object"
                    required:
                      - "unread"
                      - "items"
                    properties:
                      unread:
                        type: "integer"
                        description: "Activity rows newer than the user's last-seen cursor."
                      items:
                        type: "array"
                        description: "Newest first, from the activity table (kb/activity.mjs)."
                        items:
                          type: "object"
                          required:
                            - "id"
                            - "kind"
                            - "title"
                            - "detail"
                            - "link"
                            - "createdAt"
                          properties:
                            id:
                              type: "integer"
                            kind:
                              type: "string"
                            title:
                              type: "string"
                            detail:
                              type:
                                - "object"
                                - "null"
                              additionalProperties: true
                              description: "The event's structured detail; its keys depend on the kind, so they are not declared."
                            link:
                              type:
                                - "string"
                                - "null"
                            createdAt:
                              type: "string"
                              description: "Local time as stored (YYYY-MM-DD HH:MM:SS)."
                  tokens:
                    type: "object"
                    required:
                      - "window"
                      - "windowDays"
                      - "since"
                      - "totals"
                      - "byModel"
                      - "bySource"
                      - "byEndpoint"
                      - "turnComposition"
                    properties:
                      window:
                        type: "string"
                        enum:
                          - "day"
                          - "week"
                      windowDays:
                        type: "integer"
                        enum:
                          - 1
                          - 7
                        description: "Calendar days in the window: 1 = today since local midnight (same as the daily model-limit cap), 7 = the last 7 days including today."
                      since:
                        type: "string"
                        description: "Window start, server-local time 'YYYY-MM-DD HH:MM:SS' (the usage ledger's format)."
                      totals:
                        type: "object"
                        required:
                          - "calls"
                          - "runs"
                          - "input"
                          - "output"
                          - "cacheRead"
                          - "cacheWrite"
                          - "billable"
                        properties:
                          calls:
                            type: "integer"
                          runs:
                            type: "integer"
                          input:
                            type: "integer"
                          output:
                            type: "integer"
                          cacheRead:
                            type: "integer"
                          cacheWrite:
                            type: "integer"
                          billable:
                            type: "integer"
                      byModel:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "calls"
                            - "runs"
                            - "input"
                            - "output"
                            - "cacheRead"
                            - "cacheWrite"
                            - "billable"
                            - "provider"
                            - "model"
                          properties:
                            calls:
                              type: "integer"
                            runs:
                              type: "integer"
                            input:
                              type: "integer"
                            output:
                              type: "integer"
                            cacheRead:
                              type: "integer"
                            cacheWrite:
                              type: "integer"
                            billable:
                              type: "integer"
                            provider:
                              type: "string"
                            model:
                              type: "string"
                      bySource:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "calls"
                            - "runs"
                            - "input"
                            - "output"
                            - "cacheRead"
                            - "cacheWrite"
                            - "billable"
                            - "source"
                          properties:
                            calls:
                              type: "integer"
                            runs:
                              type: "integer"
                            input:
                              type: "integer"
                            output:
                              type: "integer"
                            cacheRead:
                              type: "integer"
                            cacheWrite:
                              type: "integer"
                            billable:
                              type: "integer"
                            source:
                              type: "string"
                              description: "api, cli or auto-task."
                      byEndpoint:
                        type: "array"
                        items:
                          type: "object"
                          required:
                            - "calls"
                            - "runs"
                            - "input"
                            - "output"
                            - "cacheRead"
                            - "cacheWrite"
                            - "billable"
                            - "endpoint"
                          properties:
                            calls:
                              type: "integer"
                            runs:
                              type: "integer"
                            input:
                              type: "integer"
                            output:
                              type: "integer"
                            cacheRead:
                              type: "integer"
                            cacheWrite:
                              type: "integer"
                            billable:
                              type: "integer"
                            endpoint:
                              type:
                                - "string"
                                - "null"
                              description: "null when the row recorded no endpoint."
                      turnComposition:
                        type: "object"
                        required:
                          - "turns"
                          - "avgFirstCallPromptTokens"
                          - "avgPrefixTokens"
                          - "avgFenceTokens"
                          - "avgToolResultTokens"
                        description: "Averages over the caller's newest 50 v2 turns (turn_composition, kb/turn-composition.mjs). All are chars/4 estimates of LLM-IDE text except avgFirstCallPromptTokens, which is the first API call's real prompt size (input + cache write + cache read). Prefix = system prompt + skills append + LLM-IDE tool definitions; fence = context + memory + skills fences; null when no turn reported the value."
                        properties:
                          turns:
                            type: "integer"
                          avgFirstCallPromptTokens:
                            type:
                              - "integer"
                              - "null"
                          avgPrefixTokens:
                            type:
                              - "integer"
                              - "null"
                          avgFenceTokens:
                            type:
                              - "integer"
                              - "null"
                          avgToolResultTokens:
                            type:
                              - "integer"
                              - "null"
                  knowledge:
                    type: "object"
                    required:
                      - "sources"
                      - "meetings"
                      - "pendingReviews"
                      - "outcomes"
                      - "codeGraph"
                      - "projectMemory"
                    properties:
                      sources:
                        type: "object"
                        required:
                          - "total"
                          - "byKind"
                        properties:
                          total:
                            type: "integer"
                          byKind:
                            type: "array"
                            items:
                              type: "object"
                              required:
                                - "kind"
                                - "count"
                                - "lastIndexedAt"
                              properties:
                                kind:
                                  type: "string"
                                count:
                                  type: "integer"
                                lastIndexedAt:
                                  type:
                                    - "string"
                                    - "null"
                      meetings:
                        type: "object"
                        required:
                          - "count"
                        properties:
                          count:
                            type: "integer"
                      pendingReviews:
                        type: "integer"
                        description: "review_items with status pending."
                      outcomes:
                        type: "object"
                        required:
                          - "total"
                          - "terminal"
                          - "byState"
                        properties:
                          total:
                            type: "integer"
                          terminal:
                            type: "integer"
                          byState:
                            type: "object"
                            description: "Row count per outcome state (open, merged, closed, ...)."
                            additionalProperties:
                              type: "integer"
                      codeGraph:
                        type: "array"
                        description: "Freshness of each code graph this user has uploaded."
                        items:
                          type: "object"
                          required:
                            - "repoId"
                            - "commitSha"
                            - "generatedAt"
                          properties:
                            repoId:
                              type: "string"
                            commitSha:
                              type:
                                - "string"
                                - "null"
                            generatedAt:
                              type:
                                - "string"
                                - "null"
                      projectMemory:
                        type: "array"
                        description: "Per repo, the project-memory ledger facts (kb/memory-ledger.mjs): active and superseded counts."
                        items:
                          type: "object"
                          required:
                            - "repoRoot"
                            - "facts"
                            - "active"
                            - "superseded"
                            - "lastConfirmedAt"
                          properties:
                            repoRoot:
                              type: "string"
                            facts:
                              type: "integer"
                            active:
                              type: "integer"
                            superseded:
                              type: "integer"
                            lastConfirmedAt:
                              type:
                                - "string"
                                - "null"
                  macOnly:
                    type: "object"
                    description: "Kits the server cannot see yet; shown from the Mac app (the v1 gap)."
                    required:
                      - "loop"
                      - "autoTasks"
                    properties:
                      loop:
                        type: "string"
                        const: "on this Mac"
                      autoTasks:
                        type: "string"
                        const: "on this Mac"
                  storage:
                    "$ref": "#/components/schemas/OsStorageReport"
                  agents:
                    type: "object"
                    required:
                      - "recentRuns"
                    properties:
                      recentRuns:
                        type: "array"
                        description: "This user's newest 20 agent runs (Stage 1c)."
                        items:
                          "$ref": "#/components/schemas/OsAgentRun"
        "400":
          description: "window is not day or week"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: "Missing or invalid access token"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  /kb/os/stream:
    get:
      summary: "System view change channel (Server-Sent Events)"
      description: "A per-user event stream that tells the System view when to re-fetch GET /kb/os/state. It opens with a hello event; after that each event is a change notice (activity, usage, turn-start, turn-end, agent-run or live-session) carrying only its type and time, never data. Bursts of one type are coalesced to one event per 250 ms per stream. A heartbeat comment is sent every 30 s, and the stream closes after 10 minutes idle. At most 4 streams per user."
      tags:
        - "os"
      responses:
        "200":
          description: "Server-sent events: hello, then change notices"
          content:
            text/event-stream:
              schema:
