                "$ref": "#/components/schemas/Error"
  /kb/agent/personas/{id}:
    put:
      summary: "Update a persona by ID"
      tags:
        - "agent"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                promptSuffix:
                  type: "string"
                autoDispatch:
                  type: "boolean"
      responses:
        "200":
          description: "Updated persona"
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "persona"
