    EntityBlocker:
      type: "object"
      required:
        - "text"
        - "severity"
        - "quote"
      properties:
        text:
          type: "string"
        severity:
          enum:
            - "low"
            - "med"
            - "high"
          description: "Any other model value is coerced to med."
        quote:
          type: "string"
    EntityDecision:
      type: "object"
      required:
        - "text"
        - "participants"
        - "quote"
      properties:
        text:
          type: "string"
        participants:
          type: "array"
          items:
            type: "string"
        quote:
          type: "string"
    Error:
      description: "The error envelope every failing /kb/* and legacy route returns (extension/core/errors.mjs, sendError). code is a stable identifier clients switch on; message is prose; details is optional structured context (e.g. the guardrail report on GUARDRAIL_FAILED)."
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            details:
              description: "Code-specific structured detail (e.g. guardrail report)"
    ExecutionFailure:
      type: "object"
      description: "The 500 body of approve when execution throws. The item is already marked failed, and result.error holds the message."
      required:
        - "error"
        - "item"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              enum:
                - "REVIEW_EXECUTION_FAILED"
            message:
              type: "string"
        item:
          "$ref": "#/components/schemas/ReviewItem"
    FeatureDisabled:
      type: "object"
      required:
        - "error"
        - "feature"
      properties:
        error:
          const: "feature_disabled"
        feature:
          type: "string"
      description: "404 body for a path owned by a feature the server was started without (LLMIDE_FEATURES). Deliberately not the Error envelope: a client can tell it from an unknown route without parsing a message."
    Finding:
      type: "object"
      description: "One guardrail finding (extension/guardrails/rules.mjs check()). severity is blocking (fails the gate), warning (shown, does not fail) or info. details, when present, carries the matched snippets of a secret or PII finding; snippets are redacted before they are stored."
      required:
        - "ruleId"
        - "severity"
        - "message"
      properties:
        ruleId:
          type: "string"
        severity:
          type: "string"
          enum:
            - "blocking"
            - "warning"
            - "info"
        message:
          type: "string"
        details:
          type: "array"
          items:
            type: "object"
            additionalProperties: true
    GitIndex:
      type: "object"
      required:
        - "ok"
        - "repo"
        - "filesScanned"
        - "filesIndexed"
        - "filesWritten"
        - "unchanged"
        - "removed"
        - "chunks"
      properties:
        ok:
          const: true
        repo:
          type: "string"
        filesScanned:
          type: "integer"
        filesIndexed:
          type: "integer"
        filesWritten:
          type: "integer"
        unchanged:
          type: "integer"
        removed:
          type: "integer"
        chunks:
          type: "integer"
    GoogleStatus:
      type: "object"
      required:
        - "status"
      properties:
        status:
          enum:
            - "pending"
            - "complete"
            - "error"
            - "unknown"
          description: "unknown: the state is expired or was never issued"
        email:
          type: "string"
        message:
          type: "string"
    GuardrailRejection:
      type: "object"
      description: "The 422 body of approve. CREDENTIAL_REQUIRED: the only blocking finding is dispatch.creds; the item stays pending and nothing is sent. GUARDRAILS_FAILED: the guardrails fail at approval time; the item is auto-rejected (item.status is rejected, with the reviewer note 'Auto-rejected: guardrails fail at approval time.')."
      required:
        - "error"
        - "guardrails"
        - "item"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              enum:
                - "CREDENTIAL_REQUIRED"
                - "GUARDRAILS_FAILED"
            message:
              type: "string"
        guardrails:
          "$ref": "#/components/schemas/Guardrails"
        item:
          "$ref": "#/components/schemas/ReviewItem"
    Guardrails:
      type: "object"
      description: "The guardrail report runGuardrails returns for the item, as stored at submit and re-run at approval time. passed is false when any finding has severity blocking. findings is the full list; the server also sends blocking, warnings and info, which are the same findings partitioned by severity (open keys, so not declared here)."
      required:
        - "passed"
        - "findings"
      properties:
        passed:
          type: "boolean"
        findings:
          type: "array"
          items:
            "$ref": "#/components/schemas/Finding"
      additionalProperties: true
    Health:
      type: "object"
      required:
        - "status"
        - "apiVersion"
        - "schemaVersion"
        - "uptimeSec"
        - "endpoints"
        - "features"
        - "checks"
      properties:
        status:
          enum:
            - "ok"
            - "degraded"
          description: "ok when the DB, the Claude CLI probe and .skills all pass; degraded otherwise"
        apiVersion:
          type: "integer"
          description: "SERVER_API_VERSION"
        schemaVersion:
          type: "integer"
          description: "current migration number"
        uptimeSec:
          type: "integer"
        endpoints:
          type: "array"
          items:
            type: "string"
          description: "Endpoints this process serves; a feature disabled by LLMIDE_FEATURES drops its paths (v74)."
        features:
          type:
            - "array"
            - "null"
          items:
            type: "string"
          description: "Null means every feature is enabled; otherwise the sorted enabled feature keys, with agent_chat always included."
        storage:
          type: "object"
          description: "Where the global data lives (core/data-dir.mjs): location is 'system' (LLMIDE_DATA_DIR, the Mac app's Application Support dir) or 'repo-kb' (the checkout's kb/); migration is the boot copy outcome (kb/data-dir-migration.mjs: migrated | skipped | fallback). No paths."
          required:
            - "location"
            - "migration"
          properties:
            location:
              enum:
                - "system"
                - "repo-kb"
                - "custom"
              description: "system: LLMIDE_DATA_DIR; repo-kb: the checkout's kb/; custom: an explicit LLMIDE_DB_PATH"
            migration:
              type: "string"
              description: "migrated | skipped | fallback"
            legacyDiverged:
              type: "boolean"
              description: "true when the legacy <repo>/kb/data.db exists again after the move to the data dir (an older server recreated it, a fork)"
            notes:
              type: "array"
              items:
                type: "string"
              description: "What the boot migration left in place (backups/, an agent-sdk/ over the cap). Strings carry no paths."
        checks:
          type: "object"
          required:
            - "db"
            - "claude"
            - "skills"
          properties:
            db:
              type: "boolean"
            claude:
              type: "boolean"
            claudeError:
              type: "string"
              description: "present only while claude is false"
            skills:
              type: "boolean"
            skillsError:
              type: "string"
              description: "present only while skills is false"
