        watermark:
          type:
            - "string"
            - "null"
          description: "The last day folded into the daily rollups."
    OsAgentRun:
      type: "object"
      description: "One agent run for the System view. No prompt, message or error text: codes only."
      required:
        - "id"
        - "source"
        - "engine"
        - "status"
        - "startedAt"
        - "endedAt"
        - "durationMs"
        - "tokens"
        - "toolCalls"
        - "model"
        - "errorCode"
      properties:
        id:
          type: "string"
        source:
          type: "string"
          enum:
            - "chat"
            - "loop"
            - "meeting"
            - "autotask"
            - "dispatch"
            - "review"
        engine:
          type:
            - "string"
            - "null"
        status:
          type: "string"
          enum:
            - "running"
            - "ok"
            - "error"
            - "cancelled"
            - "aborted"
        startedAt:
          type: "string"
        endedAt:
          type:
            - "string"
            - "null"
        durationMs:
          type:
            - "integer"
            - "null"
        tokens:
          type: "integer"
          description: "Input plus output tokens of the run."
        toolCalls:
          type: "integer"
        model:
          type:
            - "string"
            - "null"
        errorCode:
          type:
            - "string"
            - "null"
    OsEventsEvent:
      title: "os/stream SSE wire event"
      description: "One data: payload on GET /kb/os/stream (os-kit OS-2). Events carry only the type and the time, never data: they tell the System view when to re-fetch GET /kb/os/state. The stream opens with one hello event. The SSE event: line equals type. Every variant sets additionalProperties:false, so a field added server-side must be added here in the same edit."
      type: "object"
      required:
        - "type"
        - "at"
      oneOf:
        - title: "hello"
          description: "The first event on connect: the stream is open."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "hello"
            at:
              type: "string"
              description: "ISO 8601 time the stream opened."
        - title: "activity"
          description: "An activity row was recorded (kb/activity.mjs). Carries no payload; the client re-fetches GET /kb/os/state. Bursts of one type are coalesced to at most one event per 250 ms per stream."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "activity"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
        - title: "usage"
          description: "A usage_ledger row was recorded (kb/usage.mjs). Carries no payload; coalesced as above."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "usage"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
        - title: "turn-start"
          description: "A chat turn began (routes/agent-v2.mjs). Carries no payload; coalesced as above."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "turn-start"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
        - title: "turn-end"
          description: "A chat turn ended (routes/agent-v2.mjs). Carries no payload; coalesced as above."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "turn-end"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
        - title: "agent-run"
          description: "A meeting-agent run started or stopped (agents/meeting-agent.mjs). Carries no payload; coalesced as above."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "agent-run"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
        - title: "live-session"
          description: "The live capture session list changed (agents/live-sessions.mjs). Carries no payload; coalesced as above."
          additionalProperties: false
          required:
            - "type"
            - "at"
          properties:
            type:
              const: "live-session"
            at:
              type: "string"
              description: "ISO 8601 time the change was published to the stream."
    OsStorageGroup:
      type: "object"
      description: "One data group of the Storage hub. agent_history carries bytes (approximate) and the clear/compact actions; the main-DB groups carry rows per user and no bytes (SQLite sizes whole files, not users)."
      required:
        - "key"
        - "label"
        - "rows"
        - "bytes"
        - "bytesApprox"
        - "lastCleanedAt"
        - "retentionDays"
        - "actions"
      properties:
        key:
          type: "string"
          enum:
            - "agent_history"
            - "search_index"
            - "code_graph"
            - "sources"
            - "meetings"
        label:
          type: "string"
        rows:
          type: "integer"
          description: "Rows for this user. agent_history: runs, tool events and composition rows (the rows Clear can delete; the activity feed is not counted). search_index: indexed chunks. code_graph: repos. sources: distinct source kinds. meetings: meetings."
        bytes:
          type:
            - "integer"
            - "null"
          description: "Approximate bytes for agent_history; null for the main-DB groups."
        bytesApprox:
          type:
            - "boolean"
            - "null"
        lastCleanedAt:
          type:
            - "string"
            - "null"
          description: "ISO time of the last clear (agent_history only)."
        retentionDays:
          type:
            - "integer"
            - "null"
          description: "Raw-row retention (agent_history only)."
        actions:
          type: "array"
          items:
            type: "string"
            enum:
              - "clear"
              - "compact"
          description: "Actions the page may offer. Only agent_history has any."
    OsStorageReport:
      type:
        - "object"
        - "null"
      required:
