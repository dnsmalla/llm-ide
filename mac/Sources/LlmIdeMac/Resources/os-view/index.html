<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System (placeholder)</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, system-ui, sans-serif; margin: 24px; }
  pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<p><strong>System view placeholder.</strong> The real React bundle replaces this file.</p>
<pre id="config">waiting for configuration...</pre>
<script>
  // Placeholder contract: announce readiness, then show whatever the app
  // sends through window.llmideConfigure({baseURL, token, theme, projectName}).
  window.llmideConfigure = function (config) {
    document.getElementById('config').textContent = JSON.stringify(
      Object.assign({}, config, { token: config.token ? '(present)' : null }), null, 2);
  };
  function post(msg) {
    var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.llmide;
    if (h) h.postMessage(msg);
  }
  post({ type: 'ready' });
</script>
</body>
</html>
