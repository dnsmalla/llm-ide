name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    name: Swift (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18", "20"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  schema:
    name: Schema conformance (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate fixtures against the canonical JSON Schema
        run: |
          npx --yes ajv-cli@5 validate \
            -s schema/graph.schema.json \
            -d "schema/fixtures/*.json" \
            --spec=draft2020
