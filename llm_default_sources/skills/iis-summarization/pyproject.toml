[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iis-summarization"
version = "1.0.0"
description = "Diagnose infeasible Gurobi optimization models and produce actionable remediation reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
keywords = ["gurobi", "iis", "infeasibility", "optimization", "linear-programming"]

dependencies = [
    "gurobipy>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
iis-analyze = "iis_summarization.cli:main"

# ─────────────────────────────────────────────────────────────
# Packaging — src/ layout
# ─────────────────────────────────────────────────────────────
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["iis_summarization*"]

[tool.setuptools.package-data]
iis_summarization = ["templates/*.md"]

# ─────────────────────────────────────────────────────────────
# Ruff (lint + format)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501",  # line-too-long: already softly limited by line-length
]

# ─────────────────────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true   # gurobipy has no stubs
files = ["src/iis_summarization"]

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "gurobi: tests that require a working Gurobi installation",
]
