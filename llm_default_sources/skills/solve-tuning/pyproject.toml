[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solve-tuning"
version = "0.1.0"
description = "Explain a Gurobi solver log and recommend parameter/formulation changes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Only needed for --lp model-file analysis; the log-only path is dependency-free.
model = ["gurobipy>=10.0"]
dev = ["pytest>=7", "ruff", "mypy", "gurobipy>=10.0"]

[project.scripts]
solve-tuning = "solve_tuning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
]
ignore = [
    "E501",  # line-too-long: already softly limited by line-length
]

[tool.ruff.lint.per-file-ignores]
# importorskip("gurobipy") must run before the package imports → E402 by design.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
ignore_missing_imports = true
files = ["src/solve_tuning"]
