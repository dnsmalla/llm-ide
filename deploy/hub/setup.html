<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM-IDE hub setup</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem; color: #111; }
    label { display: block; margin: 1rem 0 .25rem; font-weight: 600; }
    input, button { font: inherit; width: 100%; padding: .6rem; box-sizing: border-box; }
    button { margin-top: 1.25rem; background: #111; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    .status { margin-top: 1rem; white-space: pre-wrap; }
    .hint { color: #555; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Create the hub owner</h1>
  <p class="hint">This page works once, with the setup token from the LLM-IDE deploy. The first account becomes the owner.</p>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="name">Display name (optional)</label>
    <input id="name" type="text" autocomplete="name">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <button type="submit">Create owner account</button>
  </form>
  <p id="s" class="status" role="status"></p>
  <script>
    (function () {
      // The one-time token travels in the fragment: a fragment is never sent to the server or written to an access log.
      var token = new URLSearchParams(location.hash.replace(/^#/, "")).get("t") || "";
      history.replaceState(null, "", location.pathname);
      document.getElementById("f").addEventListener("submit", async function (e) {
        e.preventDefault();
        var s = document.getElementById("s");
        s.textContent = "Creating…";
        try {
          var r = await fetch("/auth/register", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              email: document.getElementById("email").value,
              displayName: document.getElementById("name").value || undefined,
              password: document.getElementById("password").value,
              bootstrap: token
            })
          });
          var b = await r.json().catch(function () { return {}; });
          if (r.ok) { s.textContent = "Owner created. Return to LLM-IDE and press \"I created the owner account\"."; document.getElementById("f").hidden = true; }
          else { s.textContent = (b.error && b.error.message) || ("Could not create the owner (" + r.status + ")."); }
        } catch (err) { s.textContent = "Could not reach the hub."; }
      });
    })();
  </script>
</body>
</html>
