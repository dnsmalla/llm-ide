name: desktop-release (UNSIGNED DRAFT)

# DRAFT. Manual dispatch only. Builds UNSIGNED, un-notarised Tauri bundles on
# macOS, Windows and Linux and uploads them as workflow artifacts. It does not
# create a GitHub release, does not publish, and references no signing secrets:
# signing, notarisation and the update channel are pending user decisions, see
# docs/how-to/desktop-signing-decisions.md. Do not distribute these artifacts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: UNSIGNED bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each runner stages and tests its OWN target (native node, native smoke test);
          # cross-staging is not used. macos-15-intel is the x64 runner.
          - name: macOS-arm64
            os: macos-latest
            bundles: app,dmg
          - name: macOS-x64
            os: macos-15-intel
            bundles: app,dmg
          - name: Windows-x64
            os: windows-latest
            bundles: nsis
          - name: Linux-x64
            os: ubuntu-latest
            bundles: deb,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install npm dependencies (desktop and extension)
        run: |
          npm ci --prefix desktop
          npm ci --prefix extension

      # The node that ships is the pinned official Node LTS for this runner's target
      # (desktop/scripts/node-pin.json): downloaded from nodejs.org and SHA-256 verified
      # against the repo pin AND nodejs.org's SHASUMS256.txt, fail closed. The runner's own
      # node (setup-node above) only runs the scripts. LLMIDE_STAGE_RELEASE=1 refuses the
      # LLMIDE_NODE_BIN dev override.
      - name: Stage the Node core (pinned official node, verified)
        env:
          LLMIDE_STAGE_RELEASE: '1'
        run: node desktop/scripts/stage-core.mjs

      # Imports every runtime dependency (incl. an in-memory better-sqlite3 open) with the
      # STAGED node, then starts the staged core the way the host does and checks /health,
      # the nonce echo, the data-dir DB and that no process survives the stop. No model call.
      - name: Smoke-test the staged core
        run: |
          node desktop/scripts/check-core-deps.mjs
          node desktop/scripts/smoke-core.mjs

      - name: Build UNSIGNED bundles
        working-directory: desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v7
        with:
          name: llmide-desktop-UNSIGNED-${{ matrix.name }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 7
