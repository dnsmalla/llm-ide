name: skills-drift

# Fail if the synced agent-loop tool definitions (extension/llm_agent/internal/skills
# and the managed .md defs in extension/llm_agent/global) have drifted from the
# central dnsmalla/agent-kit repo at the commit pinned in .skills-lock (repo root,
# the file scripts/sync-skills.sh writes).
# App-local files (prompt.md) and read-tool handlers are not
# managed by the sync and are not checked. Author tool defs in central, then run
# `npm run sync:skills` and commit.

on:
  push:
  pull_request:

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Re-sync from central @ .skills-lock and check for drift
        run: |
          set -euo pipefail
          # dnsmalla/agent-kit is PRIVATE. Neither an anonymous clone nor this
          # repo's GITHUB_TOKEN (cross-repo, no access) can fetch it, so the
          # check needs a PAT with read access stored as CENTRAL_SKILLS_TOKEN.
          # Until that secret exists, notice-and-pass rather than fail with a
          # cryptic clone error — the drift check is advisory infrastructure.
          if [ -z "${{ secrets.CENTRAL_SKILLS_TOKEN }}" ]; then
            echo "::notice::skills-drift skipped: set the CENTRAL_SKILLS_TOKEN repo secret (a PAT with read access to dnsmalla/agent-kit) to enable it."
            exit 0
          fi
          ref="$(cat ../.skills-lock 2>/dev/null || echo main)"
          git clone --quiet "https://x-access-token:${{ secrets.CENTRAL_SKILLS_TOKEN }}@github.com/dnsmalla/agent-kit.git" "$RUNNER_TEMP/central"
          git -C "$RUNNER_TEMP/central" checkout --quiet "$ref"
          SKILLS_REPO="$RUNNER_TEMP/central" bash scripts/sync-skills.sh
          # Everything the sync writes: the tool defs, the managed global defs and the lock. App-local files in
          # global/ (prompt.md) are preserved by the sync, so they never show up here.
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code -- \
                 extension/llm_agent/internal/skills \
                 extension/llm_agent/global \
                 .skills-lock; then
            echo "::error::Synced agent-tool/global defs differ from central@${ref}. Run 'npm run sync:skills' and commit."
            exit 1
          fi
          echo "✓ agent-tool/global defs match central@${ref}"
