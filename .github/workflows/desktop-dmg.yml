name: desktop-dmg

# Builds UNSIGNED macOS disk images (Apple Silicon + Intel) for a GitLab Release.
# Triggered only by scripts/release-dmg.sh (workflow_dispatch), which downloads the artifacts and publishes them
# to GitLab. The app is ad-hoc signed only (no Apple Developer ID, no notarization, no secrets), so macOS asks
# the user to approve the first launch. This is the owner's decision: nothing private is shared with the company.
# Do not use this for the signed pipeline: see desktop-release.yml.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, x.y.z (stamped into the app and the SSH bundle before the build; names the files)'
        type: string
        required: true

permissions:
  contents: read

run-name: desktop-dmg ${{ inputs.version }}

concurrency:
  group: desktop-dmg-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  dmg:
    name: DMG (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, arch: x64 }
    env:
      VERSION: ${{ inputs.version }}
      RUST_VERSION: '1.99.1'
      # Makes build-desktop-mac.sh keep the pinned toolchain instead of preferring ~/.rustup stable.
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - name: Validate version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be x.y.z, got '$VERSION'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out graph-kit submodule (System page web source)
        run: git submodule update --init graph-kit
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Rust (pinned)
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add x86_64-unknown-linux-musl
      # CI-only, never committed: the app, its Cargo package and the SSH bundle name must carry the release version
      # (ssh_cmds uses CARGO_PKG_VERSION and the bundle in Resources/hub must match it).
      - name: Stamp the release version
        run: node scripts/stamp-version.mjs "$VERSION"
      - name: Stage the Linux SSH server bundle
        run: node desktop/scripts/stage-hub-core.mjs --version "$VERSION"
      - name: Build the unsigned app and DMG
        env:
          LLMIDE_ADHOC_SIGN: '1'
          LLMIDE_OMIT_SOURCE_ROOT: '1'
          # vite build of the desktop + ui screens passes Node's ~2 GB default heap on the runners
          # (run 45975585612 aborted with "JavaScript heap out of memory"); desktop-ci.yml raises it too.
          NODE_OPTIONS: --max-old-space-size=6144
        run: scripts/build-desktop-mac.sh --dmg
      - name: Check the SSH bundle is inside the app
        run: |
          app=desktop/src-tauri/target/release/bundle/macos/LLM-IDE.app
          ls "$app"/Contents/Resources/hub/*.tar.gz
      - name: Name the DMG and write its checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          out="$RUNNER_TEMP/dmg-out"
          mkdir -p "$out"
          built="$(ls desktop/src-tauri/target/release/bundle/macos/LLM-IDE-*.dmg)"
          [ "$(printf '%s\n' "$built" | wc -l)" -eq 1 ] || { echo "::error::expected one dmg, got: $built"; exit 1; }
          name="LLM-IDE-$VERSION-$ARCH.dmg"
          cp "$built" "$out/$name"
          (cd "$out" && shasum -a 256 "$name" > "$name.sha256" && cat "$name.sha256")
          echo "OUT_DIR=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llm-ide-dmg-${{ matrix.arch }}
          path: ${{ env.OUT_DIR }}/*
          retention-days: 3
          if-no-files-found: error
