name: sqlite-linux-compat

# Builds better-sqlite3 against glibc 2.28 for the SSH server bundle. The prebuild shipped in the package
# needs glibc 2.34, and Ubuntu 20.04 servers have 2.31. Manual only: the artifact is downloaded and then
# staged with `stage-hub-core.mjs --compat-sqlite`, so this workflow never publishes anything itself.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # manylinux_2_28 is AlmaLinux 8 (glibc 2.28), so anything linked here runs on the 2.31 servers.
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    env:
      # Must match desktop/scripts/node-pin.json; the first step fails if they differ.
      NODE_VERSION: '22.23.4'
      OUT_DIR: ${{ github.workspace }}/sqlite-compat-out
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Node
        run: |
          set -euo pipefail
          # The tarball hash comes from node-pin.json so the pin lives in one place.
          read -r file sha < <(python3 - <<'PY'
          import json
          import os
          pin = json.load(open('desktop/scripts/node-pin.json'))
          if pin['version'] != os.environ['NODE_VERSION']:
              raise SystemExit('desktop/scripts/node-pin.json version differs from NODE_VERSION')
          target = pin['targets']['linux-x64']
          print(target['file'], target['sha256'])
          PY
          )
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VERSION}/${file}"
          echo "${sha}  ${file}" | sha256sum -c -
          tar -xzf "${file}" -C /opt
          echo "/opt/${file%.tar.gz}/bin" >> "$GITHUB_PATH"

      - name: Install build tools
        run: dnf install -y binutils

      - name: Read the pinned versions and fetch the tarball
        id: pkg
        run: |
          set -euo pipefail
          helpers="$GITHUB_WORKSPACE/desktop/scripts/sqlite-compat.mjs"
          # Both versions come from the lockfile; lockedPackage fails when either entry is missing.
          pinned=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { lockedPackage } = await import(process.argv[1]);
            const lock = JSON.parse(readFileSync(process.argv[2], 'utf8'));
            const bs = lockedPackage(lock, 'node_modules/better-sqlite3');
            const addon = lockedPackage(lock, 'node_modules/node-addon-api');
            console.log([bs.version, bs.integrity, addon.version].join(' '));
          " "$helpers" "$GITHUB_WORKSPACE/extension/package-lock.json")
          read -r version integrity addon_version <<< "$pinned"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "addon_version=${addon_version}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bs" && cd "$RUNNER_TEMP/bs"
          npm pack "better-sqlite3@${version}"
          # The registry's sha512 integrity must match the lockfile: a mismatch means the module would be
          # built from a different package than the one the desktop ships against.
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { integrityOf } = await import(process.argv[1]);
            const actual = integrityOf(readFileSync(process.argv[2]));
            if (actual !== process.argv[3]) {
              console.error('::error::better-sqlite3 tarball integrity ' + actual + ' differs from the lockfile ' + process.argv[3]);
              process.exit(1);
            }
            console.log('tarball integrity matches the lockfile');
          " "$helpers" "$RUNNER_TEMP/bs/better-sqlite3-${version}.tgz" "$integrity"
          tar -xzf "better-sqlite3-${version}.tgz"

      - name: Build the module against glibc 2.28
        env:
          ADDON_VERSION: ${{ steps.pkg.outputs.addon_version }}
          # gyp's make generator sets LDFLAGS.target ?= $(LDFLAGS), so this reaches the module's link line
          # next to the flags binding.gyp already sets. Static libstdc++ and libgcc mean the module does not
          # depend on the server's C++ runtime; the symbol-ceiling check below confirms the effect.
          LDFLAGS: -static-libstdc++ -static-libgcc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bs/package"
          # node-addon-api supplies the headers binding.gyp includes; it is pinned to the lockfile version.
          npm install --omit=dev --ignore-scripts --no-audit --no-fund "node-addon-api@${ADDON_VERSION}"
          npm exec --yes --package=node-gyp@11 -- node-gyp rebuild --release --force_build=1 --target="${NODE_VERSION}"

      - name: Check the symbol ceilings
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bs/package"
          objdump -T build/Release/better_sqlite3.node > "$RUNNER_TEMP/objdump.txt"
          node "$GITHUB_WORKSPACE/desktop/scripts/sqlite-compat-check.mjs" "$RUNNER_TEMP/objdump.txt"

      - name: Load the module and run a query
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bs/package"
          # nativeBinding points at the file just built, so this loads that exact binary, not a prebuild.
          node -e "
            const Database = require('./lib');
            const db = new Database(':memory:', { nativeBinding: process.argv[1] });
            const row = db.prepare('select 1 as x').get();
            if (row.x !== 1) throw new Error('unexpected row: ' + JSON.stringify(row));
            console.log('loaded the module, select 1 returned ' + row.x);
          " "$RUNNER_TEMP/bs/package/build/Release/better_sqlite3.node"

      - name: Write the module and its checksum
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -euo pipefail
          name="better-sqlite3-${VERSION}-linux-x64-glibc2.28.node"
          mkdir -p "$OUT_DIR"
          cp "$RUNNER_TEMP/bs/package/build/Release/better_sqlite3.node" "$OUT_DIR/$name"
          (cd "$OUT_DIR" && sha256sum "$name" > "$name.sha256")
          cat "$OUT_DIR/$name.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-linux-compat
          path: |
            sqlite-compat-out/*.node
            sqlite-compat-out/*.node.sha256
          if-no-files-found: error
          retention-days: 30
