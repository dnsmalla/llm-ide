name: feature-matrix

# Nightly feature matrix (`make feature-matrix`): every removable feature
# switched off, one row at a time. The server rows run on Linux every night: a fresh server per row with its LLMIDE_FEATURES set, the
# feature_disabled 404s, /health features + endpoints, the extension's
# REQUIRED_ENDPOINTS, and the live contract test in assert mode.
#
# Failure notification: a scheduled run that fails is reported by GitHub's
# default workflow-failure email to the repository's notification recipients.
# No issue is opened, so this workflow needs no `issues: write`.

on:
  schedule:
    - cron: '23 3 * * *'   # 03:23 UTC nightly
  workflow_dispatch:

# Read-only: the matrix only reads the repo and writes to temp dirs.
permissions:
  contents: read

concurrency:
  group: feature-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-rows:
    name: Server rows (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The server rows boot extension/server.mjs, so they need its npm deps.
      # The graph-kit submodule and `.skills` are not used here (see
      # contract-ci.yml for the same reasoning).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci --no-audit --no-fund

      - name: make feature-matrix (server rows)
        run: make feature-matrix
