name: mac-ci

# Build and test the LlmIdeMac app on every push / PR that touches it.
# Foundational gate so broken builds or failing tests never reach main.

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac-ci.yml'
  pull_request:
    paths:
      - 'mac/**'
      - '.github/workflows/mac-ci.yml'

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    # Backstop only — the Test step has its own 15-minute watchdog so the
    # annotation steps below still get to run and name the hanging test.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build

      # The raw job log is admin-only on this repository, while check-run
      # annotations and artifacts are readable by anyone with the run URL — so
      # a failing `swift test` has to publish its own evidence (next two
      # steps). pipefail keeps tee from masking the test exit code.
      # A green run takes ~3 minutes; a hung test would otherwise sit until the
      # job timeout, where nothing that follows gets to run. `swift test` is
      # started in its own process group so the watchdog can take the `xctest`
      # child down with it — killing only the parent leaves the child holding
      # the log open. Exit 124 = killed by the watchdog.
      - name: Test
        shell: bash
        run: |
          set -m
          swift test > swift-test.log 2>&1 &
          pid=$!
          set +m
          for _ in $(seq 1 90); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 10
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::error::swift test still running after 15 minutes — killed; see the 'last started' annotations for the hanging test"
            kill -TERM -- "-$pid" 2>/dev/null || kill -TERM "$pid" 2>/dev/null || true
            sleep 5
            kill -KILL -- "-$pid" 2>/dev/null || true
            exit 124
          fi
          wait "$pid"

      # XCTest assertion failures and compile errors share one shape,
      # "<path>:<line>: error: <message>"; those become file/line annotations.
      # GitHub keeps ~10 annotations per level per step, hence the head limits
      # and the split across notice/warning/error below.
      - name: Surface test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+\.swift:[0-9]+(:[0-9]+)?: error: ' swift-test.log | sort -u | head -10 \
            | sed -E 's#^.*/mac/([^:]+):([0-9]+)(:[0-9]+)?: error: (.*)$#::error file=mac/\1,line=\2::\4#; t; s#^#::error::#' || true

      # A crash (fatalError, an actor-isolation trap, "Exited with unexpected
      # signal") produces none of the shapes above, so also publish the raw
      # evidence: the tail of the log and the last keyword hits.
      - name: Publish log tail as annotations
        if: failure()
        shell: bash
        run: |
          echo "::notice::swift-test.log has $(wc -l < swift-test.log | tr -d ' ') lines"
          # XCTest announces every case before running it, so the last few
          # "started" lines identify a hang; the passed/failed counts say how far
          # the suite got.
          grep -E "Test Case .* started" swift-test.log | tail -3 | cut -c1-500 | sed 's/^/::error::[last started] /' || true
          echo "::notice::cases started=$(grep -cE 'Test Case .* started' swift-test.log || true) passed=$(grep -cE 'Test Case .* passed' swift-test.log || true) failed=$(grep -cE 'Test Case .* failed' swift-test.log || true)"
          tail -30 swift-test.log | cut -c1-1500 | sed 's/%/%25/g' > tail.txt
          sed -n '1,10p'  tail.txt | sed 's/^/::notice::[tail -30..-21] /'
          sed -n '11,20p' tail.txt | sed 's/^/::warning::[tail -20..-11] /'
          sed -n '21,30p' tail.txt | sed 's/^/::error::[tail -10..-1] /'

      # Errors first: a Swift-6-mode warning repeated per compile job can push
      # the one real "error:" line out of a 30-line window, and the compiler's
      # `|` source-excerpt lines duplicate the message above them.
      - name: Publish failure keyword hits as annotations
        if: failure()
        shell: bash
        run: |
          # Dedupe by content (drop the log line number): the same error is
          # printed once per compile job, which would otherwise fill the window.
          grep -E ' error: ' swift-test.log | grep -vE 'warning:|^ +\|' \
            | cut -c1-1500 | sed 's/%/%25/g' | awk '!seen[$0]++' | tail -20 > hits.txt || true
          grep -inE 'fail|fatal|crash|signal|abort|exited|trap' swift-test.log \
            | grep -vE 'warning:|passed|with 0 failures|0 unexpected|^[0-9]+: +\|' \
            | cut -c1-1500 | sed 's/%/%25/g' | tail -10 >> hits.txt || true
          sed -n '1,10p'  hits.txt | sed 's/^/::error::[error] /'
          sed -n '11,20p' hits.txt | sed 's/^/::warning::[error] /'
          sed -n '21,30p' hits.txt | sed 's/^/::notice::[hit] /'

      - name: Upload swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: mac/swift-test.log
          if-no-files-found: ignore
