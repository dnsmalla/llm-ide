name: mac-ci

# Build and test the LlmIdeMac app on every push / PR that touches it.
# Foundational gate so broken builds or failing tests never reach main.

on:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - '.github/workflows/mac-ci.yml'
  pull_request:
    paths:
      - 'mac/**'
      - '.github/workflows/mac-ci.yml'

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: macos-15
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v7

      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: mac/.build
          key: spm-${{ runner.os }}-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build

      # The raw job log is admin-only on this repository, while check-run
      # annotations and artifacts are readable by anyone with the run URL — so
      # a failing `swift test` has to publish its own evidence (next two
      # steps). pipefail keeps tee from masking the test exit code.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log

      # XCTest assertion failures and compile errors share one shape,
      # "<path>:<line>: error: <message>"; those become file/line annotations.
      # GitHub keeps ~10 annotations per level per step, hence the head limits
      # and the split across notice/warning/error below.
      - name: Surface test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E '^[^ ]+\.swift:[0-9]+(:[0-9]+)?: error: ' swift-test.log | sort -u | head -10 \
            | sed -E 's#^.*/mac/([^:]+):([0-9]+)(:[0-9]+)?: error: (.*)$#::error file=mac/\1,line=\2::\4#; t; s#^#::error::#' || true

      # A crash (fatalError, an actor-isolation trap, "Exited with unexpected
      # signal") produces none of the shapes above, so also publish the raw
      # evidence: the tail of the log and the last keyword hits.
      - name: Publish log tail as annotations
        if: failure()
        shell: bash
        run: |
          echo "::notice::swift-test.log has $(wc -l < swift-test.log | tr -d ' ') lines"
          tail -30 swift-test.log | cut -c1-1500 | sed 's/%/%25/g' > tail.txt
          sed -n '1,10p'  tail.txt | sed 's/^/::notice::[tail -30..-21] /'
          sed -n '11,20p' tail.txt | sed 's/^/::warning::[tail -20..-11] /'
          sed -n '21,30p' tail.txt | sed 's/^/::error::[tail -10..-1] /'

      - name: Publish failure keyword hits as annotations
        if: failure()
        shell: bash
        run: |
          grep -inE 'error|fail|fatal|crash|signal|abort|exited|trap' swift-test.log \
            | grep -vE 'passed|with 0 failures|0 unexpected' | cut -c1-1500 | sed 's/%/%25/g' | tail -30 > hits.txt || true
          sed -n '1,10p'  hits.txt | sed 's/^/::notice::[hit] /'
          sed -n '11,20p' hits.txt | sed 's/^/::warning::[hit] /'
          sed -n '21,30p' hits.txt | sed 's/^/::error::[hit] /'

      - name: Upload swift test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: mac/swift-test.log
          if-no-files-found: ignore
