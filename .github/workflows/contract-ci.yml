name: contract-ci

# The HTTP contract gate (Phase 1 P16): schema conformance of every fixture,
# and the generated outputs (client types, openapi.yaml, design tokens) checked
# against their sources. The HTTP inventory is the exception: its committed
# snapshot is not a gate — route coverage is validated from the generator
# output, and the snapshot is regenerated here and uploaded as an artifact.
# Node only, ~1 s once deps are installed. Its inputs span the repo, so it
# triggers on all of them; a schema-only commit otherwise reached main with no
# check at all.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - 'scripts/**'
      - 'extension/**'
      - 'ios_app/SharedProtocol/Sources/**'
      - 'ui/**'
      - 'docs/reference/api/**'
      - 'Makefile'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'schema/**'
      - 'scripts/**'
      - 'extension/**'
      - 'ios_app/SharedProtocol/Sources/**'
      - 'ui/**'
      - 'docs/reference/api/**'
      - 'Makefile'
      - '.github/workflows/contract-ci.yml'

concurrency:
  group: contract-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gates:
    name: Contract gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci --no-audit --no-fund

      - name: make contract-gates
        run: make contract-gates

      # INVENTORY.md is a generated snapshot, not a reviewed artifact: the gate
      # above validated route coverage from the generator output. Regenerate it
      # here (never committed back) so reviewers can download the current table
      # without anyone hand-committing the file.
      - name: Regenerate HTTP inventory snapshot
        run: node scripts/http-inventory.mjs

      - name: Upload HTTP inventory
        uses: actions/upload-artifact@v7
        with:
          name: http-inventory
          path: schema/http/INVENTORY.md
          if-no-files-found: error

  # The full pre-push gate on a runner with the toolchains it needs (Swift for
  # graph-kit, Node for the extension/desktop/ui/web suites). Ubuntu has no
  # Swift, so this job is macOS; the contract job above stays the fast one.
  regression:
    name: Regression gate
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            desktop/package-lock.json
            ui/kit/package-lock.json
            web/package-lock.json

      - name: Initialize graph-kit
        run: git submodule update --init graph-kit

      - name: Install dependencies
        run: |
          (cd extension && npm ci --no-audit --no-fund)
          (cd desktop && npm ci --no-audit --no-fund)
          (cd ui/kit && npm ci --no-audit --no-fund)
          (cd web && npm ci --no-audit --no-fund)

      - name: make regression
        run: make regression
