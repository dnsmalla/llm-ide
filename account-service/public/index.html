<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create your LLM-IDE account</title>
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body data-page="signup">
  <main class="card">
    <h1>LLM-IDE</h1>
    <p class="muted">Create your account. No email verification is required in this setup; your passkey is the sign-in.</p>
    <form id="signup-form">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Display name <input id="display-name" autocomplete="name" required maxlength="80"></label>
      <label>Language <input id="language" value="en" maxlength="35"></label>
      <label>Time zone <input id="time-zone" value="UTC" maxlength="80"></label>
      <button id="submit" type="submit">Create account</button>
    </form>
    <button id="register" type="button" hidden>Register passkey</button>
    <p id="status" class="status" role="status"></p>
    <p id="support" class="muted" role="note"></p>
    <p class="muted">Already have an account? <a href="/signin.html">Sign in</a></p>
  </main>
  <script src="/app.js?v=4"></script>
</body>
</html>
